<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>쇼핑쇼츠 AI 생성기</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0c0c10;--card:#16161e;--card2:#1e1e28;--card3:#252533;--accent:#7c6fff;--accent2:#ff6b8a;--txt:#eeeef8;--sub:#7070a0;--border:#252535;--green:#20d9a0;--yellow:#ffd060;--orange:#ff8c42}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding-bottom:60px}
/* topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 0;max-width:560px;margin:0 auto}
.logo{font-size:17px;font-weight:900;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.3px}
.set-btn{background:var(--card);border:1px solid var(--border);color:var(--sub);padding:6px 12px;border-radius:20px;cursor:pointer;font-size:12px;transition:.2s}
.set-btn:hover{border-color:var(--accent);color:var(--accent)}
/* main tabs */
.tabs{display:flex;gap:8px;padding:14px 16px 0;max-width:560px;margin:0 auto}
.tab{flex:1;padding:10px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--sub);font-size:13px;font-weight:700;cursor:pointer;text-align:center;transition:all .2s}
.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}
.panel{display:none;padding:14px 16px;max-width:560px;margin:0 auto}
.panel.active{display:block}
/* cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px}
.sec-title{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.6px;text-transform:uppercase;margin-bottom:8px}
/* inputs */
label{display:block;font-size:11px;font-weight:700;color:var(--sub);margin-bottom:5px;letter-spacing:.4px;text-transform:uppercase}
input[type=text],input[type=url],textarea{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--txt);font-size:14px;outline:none;transition:border .2s;font-family:inherit}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical}
/* image row */
.img-row{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.img-ph{width:76px;height:76px;min-width:76px;border-radius:12px;background:var(--card2);border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer}
.img-preview{width:76px;height:76px;min-width:76px;border-radius:12px;object-fit:cover;border:1px solid var(--border);display:none;cursor:pointer}
/* chip rows */
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.chip{padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--card2);color:var(--sub);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;user-select:none;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.sel-desire{border-color:var(--accent2);color:var(--accent2);background:rgba(255,107,138,.12)}
.chip.sel-voice{border-color:var(--accent);color:var(--accent);background:rgba(124,111,255,.12)}
.chip.sel-size{border-color:var(--yellow);color:var(--yellow);background:rgba(255,208,96,.1)}
/* plat buttons */
.plat-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.plat-btn{padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--card2);color:var(--sub);font-size:12px;font-weight:700;cursor:pointer;transition:.15s}
.plat-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(124,111,255,.12)}
/* buttons */
.btn{width:100%;padding:13px;border-radius:12px;border:none;font-size:14px;font-weight:800;cursor:pointer;margin-top:8px;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-sm{width:auto;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;border:1px solid var(--border);background:var(--card2);color:var(--sub);cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:4px;margin-top:0}
.btn-sm:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm.green:hover{border-color:var(--green);color:var(--green)}
/* result tabs */
.rtabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px}
.rtabs::-webkit-scrollbar{height:3px}
.rtabs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.rtab{padding:7px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--sub);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.15s;flex-shrink:0}
.rtab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.script-panel{display:none}
.script-panel.active{display:block}
.result-label{font-size:10px;font-weight:700;color:var(--sub);letter-spacing:.5px;text-transform:uppercase;margin-bottom:5px;display:flex;align-items:center;justify-content:space-between}
.edit-area{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--txt);font-size:14px;outline:none;resize:vertical;font-family:inherit;line-height:1.7;transition:border .2s;min-height:60px}
.edit-area:focus{border-color:var(--accent)}
.edit-area.script-area{min-height:140px}
.sep{height:1px;background:var(--border);margin:10px 0}
/* angle badge */
.angle-badge{display:inline-block;padding:3px 10px;border-radius:20px;background:rgba(124,111,255,.15);border:1px solid rgba(124,111,255,.3);color:var(--accent);font-size:11px;font-weight:700;margin-bottom:10px}
/* spinner */
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:inline-block;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
/* badges */
.badge{display:inline-block;padding:2px 7px;border-radius:8px;font-size:10px;font-weight:700;margin-right:3px}
.badge-yt{background:#ff0000;color:#fff}
.badge-tt{background:#111;color:#fff;border:1px solid #333}
.badge-ig{background:linear-gradient(135deg,#f09433,#dc2743,#bc1888);color:#fff}
/* prod cards */
.prod-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px;display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.prod-emoji{width:44px;height:44px;min-width:44px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:22px}
.prod-info{flex:1;min-width:0}
.prod-name{font-size:13px;font-weight:700;margin-bottom:3px}
.prod-link{display:inline-block;margin-top:6px;padding:5px 11px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:7px;font-size:11px;font-weight:700;text-decoration:none}
/* modal */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modal-box{background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px;width:100%;max-width:560px;max-height:82vh;overflow-y:auto}
.modal-title{font-size:15px;font-weight:800;margin-bottom:14px}
.modal-close{float:right;background:none;border:none;color:var(--sub);font-size:20px;cursor:pointer;margin-top:-4px}
.saved-ok{display:inline-block;background:var(--green);color:#000;font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;margin-left:8px;opacity:0;transition:opacity .3s}
.saved-ok.show{opacity:1}
/* loading state */
.loading-overlay{text-align:center;padding:30px 16px;color:var(--sub)}
.loading-overlay .sp{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;margin:0 auto 12px}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">🛍 쇼핑쇼츠 AI</div>
  <button class="set-btn" onclick="openSettings()">⚙️ 설정</button>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('shorts',this)">🎬 쇼츠 생성</button>
  <button class="tab" onclick="switchTab('viral',this)">🔗 바이럴 연동</button>
</div>

<!-- ══ Tab 1: 쇼핑쇼츠 생성 ══════════════════════════════ -->
<div id="panel-shorts" class="panel active">

  <!-- 상품 정보 -->
  <div class="card">
    <div class="sec-title">📦 상품 정보</div>
    <div class="img-row">
      <div>
        <div class="img-ph" id="imgPh" onclick="document.getElementById('prodImg').focus()">📦</div>
        <img id="imgPreview" class="img-preview" alt="">
      </div>
      <div style="flex:1">
        <label>상품명</label>
        <input type="text" id="prodName" placeholder="예: 다이슨 에어랩" style="margin-bottom:8px">
        <label>이미지 URL</label>
        <input type="url" id="prodImg" placeholder="https://..." oninput="previewImg(this.value)">
      </div>
    </div>
    <label style="margin-top:8px">상품 URL (쿠팡 / 네이버 등)</label>
    <input type="url" id="prodUrl" placeholder="https://www.coupang.com/..." style="margin-bottom:8px">
    <label>추가 정보 (선택)</label>
    <textarea id="prodInfo" placeholder="가격, 특징, 타깃 등..." style="min-height:52px"></textarea>
  </div>

  <!-- 욕망/욕구 (10개) -->
  <div class="card">
    <div class="sec-title">🔥 욕망 / 욕구 <span style="color:var(--sub);font-size:10px;font-weight:400;text-transform:none">최대 3개 선택</span></div>
    <div class="chip-row" id="desireRow">
      <div class="chip" data-type="desire" onclick="selChip(this,'desire',3)">🔥 과시욕</div>
      <div class="chip" data-type="desire" onclick="selChip(this,'desire',3)">💰 절약욕</div>
      <div class="chip" data-type="desire" onclick="selChip(this,'desire',3)">💪 건강욕</div>
      <div class="chip" data-type="desire" onclick="selChip(this,'desire',3)">⚡ 편의욕</div>
      <div class="chip" data-type="desire" onclick="selChip(this,'desire',3)">✨ 아름다움욕</div>
      <div class="chip" data-type="desire" onclick="selChip(this,'desire',3)">🌟 트렌드욕</div>
      <div class="chip" data-type="desire" onclick="selChip(this,'desire',3)">❤️ 가족사랑</div>
      <div class="chip" data-type="desire" onclick="selChip(this,'desire',3)">😌 자기만족</div>
      <div class="chip" data-type="desire" onclick="selChip(this,'desire',3)">⏰ FOMO</div>
      <div class="chip" data-type="desire" onclick="selChip(this,'desire',3)">👑 인정욕</div>
    </div>
  </div>

  <!-- 음성 스타일 (10개) -->
  <div class="card">
    <div class="sec-title">🎙 음성 스타일</div>
    <div class="chip-row" id="voiceRow">
      <div class="chip" data-type="voice" onclick="selChip(this,'voice',1)">😊 친근한 언니/오빠</div>
      <div class="chip" data-type="voice" onclick="selChip(this,'voice',1)">🎓 전문가</div>
      <div class="chip" data-type="voice" onclick="selChip(this,'voice',1)">😂 유머러스</div>
      <div class="chip" data-type="voice" onclick="selChip(this,'voice',1)">💕 감성적</div>
      <div class="chip" data-type="voice" onclick="selChip(this,'voice',1)">🚨 긴박감</div>
      <div class="chip sel-voice" data-type="voice" onclick="selChip(this,'voice',1)">🔥 MZ 트렌디</div>
      <div class="chip" data-type="voice" onclick="selChip(this,'voice',1)">🌸 따뜻한 엄마</div>
      <div class="chip" data-type="voice" onclick="selChip(this,'voice',1)">💥 파워풀</div>
      <div class="chip" data-type="voice" onclick="selChip(this,'voice',1)">🤫 ASMR 속삭임</div>
      <div class="chip" data-type="voice" onclick="selChip(this,'voice',1)">🎉 신나는 쇼핑</div>
    </div>
  </div>

  <!-- 자막 크기 (10개) -->
  <div class="card">
    <div class="sec-title">📝 자막 크기</div>
    <div class="chip-row" id="sizeRow">
      <div class="chip" data-size="12" data-type="size" onclick="selChip(this,'size',1)">12px</div>
      <div class="chip" data-size="14" data-type="size" onclick="selChip(this,'size',1)">14px</div>
      <div class="chip sel-size" data-size="16" data-type="size" onclick="selChip(this,'size',1)">16px</div>
      <div class="chip" data-size="18" data-type="size" onclick="selChip(this,'size',1)">18px</div>
      <div class="chip" data-size="20" data-type="size" onclick="selChip(this,'size',1)">20px</div>
      <div class="chip" data-size="22" data-type="size" onclick="selChip(this,'size',1)">22px</div>
      <div class="chip" data-size="24" data-type="size" onclick="selChip(this,'size',1)">24px</div>
      <div class="chip" data-size="28" data-type="size" onclick="selChip(this,'size',1)">28px</div>
      <div class="chip" data-size="32" data-type="size" onclick="selChip(this,'size',1)">32px</div>
      <div class="chip" data-size="36" data-type="size" onclick="selChip(this,'size',1)">36px</div>
    </div>
    <!-- 자막 미리보기 -->
    <div id="captionPreview" style="margin-top:10px;padding:10px 14px;background:#000;border-radius:8px;text-align:center;color:#fff;font-weight:700;display:none"></div>

    <!-- 플랫폼 -->
    <div class="sec-title" style="margin-top:12px">📲 플랫폼</div>
    <div class="plat-row">
      <button class="plat-btn active" onclick="selPlat('all',this)">전체</button>
      <button class="plat-btn" onclick="selPlat('youtube',this)"><span class="badge badge-yt">YT</span> Shorts</button>
      <button class="plat-btn" onclick="selPlat('tiktok',this)"><span class="badge badge-tt">TT</span> TikTok</button>
      <button class="plat-btn" onclick="selPlat('instagram',this)"><span class="badge badge-ig">IG</span> Reels</button>
    </div>
  </div>

  <button class="btn btn-primary" id="genBtn" onclick="generateShorts()">
    ✨ 대본 5개 생성
  </button>

  <!-- 결과 영역 -->
  <div id="shortsResult" style="display:none;margin-top:12px">
    <div class="rtabs" id="scriptTabs"></div>
    <div id="scriptPanels"></div>
  </div>
</div>

<!-- ══ Tab 2: 바이럴 자동연동 ════════════════════════════ -->
<div id="panel-viral" class="panel">
  <div class="card">
    <label>유튜브 / 틱톡 / 인스타 영상 링크</label>
    <input type="url" id="viralUrl" placeholder="https://www.youtube.com/watch?v=..." style="margin-bottom:10px">
    <label>여러 링크 (줄바꿈으로 구분)</label>
    <textarea id="viralUrls" placeholder="링크1&#10;링크2&#10;링크3" style="min-height:90px"></textarea>
    <button class="btn btn-primary" id="viralBtn" onclick="analyzeViral()">
      🔍 상품 감지 + 쿠팡 자동연동
    </button>
  </div>
  <div id="viralResult"></div>
</div>

<!-- ══ 설정 모달 ══════════════════════════════════════════ -->
<div class="modal" id="settingsModal" onclick="closeIfBg(event)">
  <div class="modal-box">
    <button class="modal-close" onclick="closeSettings()">✕</button>
    <div class="modal-title">⚙️ 설정</div>

    <label>Claude API 키</label>
    <input type="text" id="claudeKey" placeholder="sk-ant-..." style="margin-bottom:6px">
    <button class="btn-sm" onclick="saveKey()" style="margin-bottom:0">저장 <span class="saved-ok" id="keySaved">✓</span></button>

    <div class="sep"></div>
    <div style="font-size:12px;font-weight:700;color:var(--sub);margin-bottom:10px">쿠팡파트너스 <span style="font-weight:400">(선택 — 딥링크용)</span></div>
    <label>Access Key</label>
    <input type="text" id="cpAccess" placeholder="액세스 키" style="margin-bottom:7px">
    <label>Secret Key</label>
    <input type="text" id="cpSecret" placeholder="시크릿 키" style="margin-bottom:7px">
    <label>Sub ID</label>
    <input type="text" id="cpSubid" placeholder="서브 ID" style="margin-bottom:6px">
    <button class="btn-sm" onclick="saveCoupang()" style="margin-bottom:0">저장 <span class="saved-ok" id="cpSaved">✓</span></button>
  </div>
</div>

<script>
// ── 상태 ──────────────────────────────────────────────────
let curPlat = 'all';
let curSubtitleSize = 16;
let lastScripts = [];

const VOICE_PROMPTS = {
  '😊 친근한 언니/오빠': '친근하고 편한 친구처럼 말하는 톤. 이모티콘 자연스럽게 사용.',
  '🎓 전문가': '권위 있고 신뢰감 있는 전문가 톤. 수치와 근거 제시.',
  '😂 유머러스': '재치 있고 웃긴 개그 스타일. 반전과 유머 포함.',
  '💕 감성적': '감동적이고 공감 가는 스토리텔링 톤.',
  '🚨 긴박감': '지금 당장 구매해야 할 것 같은 급박하고 강렬한 톤.',
  '🔥 MZ 트렌디': 'Z세대 인싸 스타일. 밈, 슬랭, 트렌디한 표현 사용.',
  '🌸 따뜻한 엄마': '부드럽고 따뜻하며 신뢰감 있는 톤.',
  '💥 파워풀': '강렬하고 임팩트 있는 힘 있는 톤. 짧고 강한 문장.',
  '🤫 ASMR 속삭임': '귀에 속삭이듯 조용하고 섬세한 톤.',
  '🎉 신나는 쇼핑': '활기차고 에너제틱한 쇼핑 호스트 톤.',
};

// ── 스토리지 ──────────────────────────────────────────────
const LS = { get: k => localStorage.getItem(k)||'', set:(k,v)=>localStorage.setItem(k,v) };
function getKey(){ return LS.get('ss_claude_key'); }
function getHeaders(){
  return {'Content-Type':'application/json','x-api-key':getKey(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
}
async function callClaude(prompt, maxTokens=2000){
  const r = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST', headers:getHeaders(),
    body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:maxTokens,messages:[{role:'user',content:prompt}]})
  });
  const d = await r.json();
  if(!r.ok) throw new Error(d.error?.message||'API 오류');
  return d.content?.[0]?.text||'';
}
function parseJSON(raw){
  const m = raw.match(/\{[\s\S]*\}/);
  if(m) try{return JSON.parse(m[0]);}catch{}
  return {};
}
function parseArray(raw){
  const m = raw.match(/\[[\s\S]*\]/);
  if(m) try{return JSON.parse(m[0]);}catch{}
  return [];
}
function getCoupangCreds(){ return {access:LS.get('ss_cp_access'),secret:LS.get('ss_cp_secret'),subid:LS.get('ss_cp_subid')}; }
function coupangSearchUrl(kw){ return `https://www.coupang.com/np/search?q=${encodeURIComponent(kw)}&channel=user`; }
function coupangDeepLink(kw){
  const c = getCoupangCreds();
  if(!c.access||!c.subid) return null;
  return `https://link.coupang.com/a/${c.subid}?url=${encodeURIComponent(coupangSearchUrl(kw))}`;
}

// ── 칩 선택 ───────────────────────────────────────────────
function selChip(el, type, max){
  const selClass = type==='desire'?'sel-desire':type==='voice'?'sel-voice':'sel-size';
  const chips = document.querySelectorAll(`.chip[data-type="${type}"]`);
  const already = el.classList.contains(selClass);
  if(max===1){
    chips.forEach(c=>c.classList.remove(selClass));
    if(!already) el.classList.add(selClass);
  } else {
    const selCount = [...chips].filter(c=>c.classList.contains(selClass)).length;
    if(already){ el.classList.remove(selClass); }
    else if(selCount<max){ el.classList.add(selClass); }
  }
  if(type==='size'){
    const sz = el.dataset.size;
    if(el.classList.contains(selClass)){
      curSubtitleSize = parseInt(sz);
      updateCaptionPreview();
      updateScriptSizes();
    }
  }
}

function getSelected(type){
  const selClass = type==='desire'?'sel-desire':type==='voice'?'sel-voice':'sel-size';
  return [...document.querySelectorAll(`.chip[data-type="${type}"].${selClass}`)].map(c=>c.textContent.trim());
}

  });
}

// ── UI ────────────────────────────────────────────────────
function switchTab(id, btn){

  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));

function selPlat(p,btn){
  curPlat=p;
  document.querySelectorAll('.plat-btn').forEach(b=>b.classList.remove('active'));

}
function previewImg(url){

  else { prev.style.display='none'; ph.style.display='flex'; }

// ── 쇼츠 생성 (5개 대본) ──────────────────────────────────
async function generateShorts(){
  const name = document.getElementById('prodName').value.trim();
  if(!name){ alert('상품명을 입력해줘.'); return; }
  if(!getKey()){ openSettings(); return; }

  const btn = document.getElementById('genBtn');
  btn.disabled=true; btn.innerHTML='<div class="spinner"></div> 5개 대본 생성 중...';
  document.getElementById('shortsResult').style.display='block';
  document.getElementById('scriptTabs').innerHTML='';
  document.getElementById('scriptPanels').innerHTML='<div class="loading-overlay"><div class="sp"></div><div>AI가 5가지 각도로 대본을 작성하고 있어요...</div></div>';

  const url = document.getElementById('prodUrl').value.trim();
  const info = document.getElementById('prodInfo').value.trim();
  const desires = getSelected('desire');
  const voices = getSelected('voice');
  const platNames = {all:'유튜브Shorts/틱톡/인스타Reels 전체',youtube:'유튜브 Shorts',tiktok:'틱톡',instagram:'인스타그램 Reels'};
  const voiceName = voices[0]||'🔥 MZ 트렌디';
  const voiceDesc = VOICE_PROMPTS[voiceName]||'자연스러운 구어체로';

  const prompt = [
    `쇼핑쇼츠 전문 카피라이터야. 아래 상품으로 ${platNames[curPlat]}용 대본을 5가지 서로 다른 각도로 만들어줘.`,
    '',
    `상품명: ${name}`,
    url?`상품URL: ${url}`:'',
    info?`추가정보: ${info}`:'',
    desires.length?`자극할 욕망/욕구: ${desires.join(', ')}`:'',
    `음성/톤 스타일: ${voiceName} — ${voiceDesc}`,
    '',
    '아래 JSON 배열 형식으로만 응답. 코드블록 없이 배열만:',
    '[',
    '  {"angle":"각도 이름(예: FOMO 긴박감)","hook":"첫 3초 훅 멘트 — 강렬하게 1-2문장","script":"15-30초 대본 (자연스러운 구어체, 타임라인 표시)","hashtags":"#태그1 #태그2 #태그3 #태그4 #태그5 #태그6 #태그7 #태그8 #태그9 #태그10","cta":"구매 유도 CTA 문구 2가지 (예: 1. 지금 링크 클릭! 2. 댓글에 쿠팡 링크 있음)"},',
    '  ... (총 5개)',
    ']',
    '각 대본은 훅/접근 방식이 확연히 달라야 해. 같은 패턴 반복 금지.'
  ].filter(Boolean).join('\n');

  try {
    const raw = await callClaude(prompt, 4000);
    let scripts = parseArray(raw);
    if(!scripts.length){
      const obj = parseJSON(raw);
      scripts = obj.scripts||[];
    }
    if(!scripts.length) throw new Error('대본 파싱 실패');
    lastScripts = scripts;
    renderScripts(scripts);
  } catch(e) {
    document.getElementById('scriptPanels').innerHTML=`<div style="color:#ff6b8a;padding:14px;font-size:13px">생성 실패: ${e.message}</div>`;
  } finally {
    btn.disabled=false; btn.innerHTML='✨ 대본 5개 생성';
  }
}

function renderScripts(scripts){
  const tabs = document.getElementById('scriptTabs');
  const panels = document.getElementById('scriptPanels');
  tabs.innerHTML='';
  panels.innerHTML='';
  scripts.forEach((s,i)=>{
    const tab = document.createElement('button');
    tab.className='rtab'+(i===0?' active':'');
    tab.textContent=`대본 ${i+1}`;
    tab.onclick=()=>switchScript(i);
    tabs.appendChild(tab);

    const panel = document.createElement('div');
    panel.className='script-panel card'+(i===0?' active':'');
    panel.id=`sp-${i}`;
    panel.innerHTML=`
      <div class="angle-badge">${escHtml(s.angle||`각도 ${i+1}`)}</div>

      <div class="result-label">
        🎣 훅 (첫 3초)
        <button class="btn-sm" onclick="copySec('hook-${i}',this)">복사</button>
      </div>
      <textarea class="edit-area" id="hook-${i}" rows="2">${escHtml(s.hook||'')}</textarea>

      <div class="sep"></div>

      <div class="result-label">
        📝 스크립트 (자막 ${curSubtitleSize}px 미리보기)
        <button class="btn-sm" onclick="copySec('script-${i}',this)">복사</button>
      </div>
      <textarea class="edit-area script-area" id="script-${i}" style="font-size:${curSubtitleSize}px">${escHtml(s.script||'')}</textarea>

      <div class="sep"></div>

      <div class="result-label">
        🏷 해시태그
        <button class="btn-sm" onclick="copySec('hash-${i}',this)">복사</button>
      </div>
      <textarea class="edit-area" id="hash-${i}" rows="2">${escHtml(s.hashtags||'')}</textarea>

      <div class="sep"></div>

      <div class="result-label">
        📣 CTA
        <button class="btn-sm" onclick="copySec('cta-${i}',this)">복사</button>
      </div>
      <textarea class="edit-area" id="cta-${i}" rows="2">${escHtml(s.cta||'')}</textarea>

      <div class="sep"></div>
      <div style="display:flex;gap:8px;margin-top:2px">
        <button class="btn-sm" onclick="regenOne(${i})" style="flex:1;justify-content:center">🔄 이 대본 다시 생성</button>
        <button class="btn-sm green" onclick="copyAll(${i})" style="flex:1;justify-content:center">📋 전체 복사</button>
      </div>
    `;
    panels.appendChild(panel);
  });
}

function switchScript(i){
  document.querySelectorAll('.rtab').forEach((t,j)=>t.classList.toggle('active',j===i));
  document.querySelectorAll('.script-panel').forEach((p,j)=>p.classList.toggle('active',j===i));
}

function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function regenOne(i){
  if(!getKey()){ openSettings(); return; }
  const name = document.getElementById('prodName').value.trim()||'상품';
  const voices = getSelected('voice');
  const voiceName = voices[0]||'🔥 MZ 트렌디';
  const voiceDesc = VOICE_PROMPTS[voiceName]||'자연스러운 구어체로';

  const hookEl=document.getElementById(`hook-${i}`);
  const scriptEl=document.getElementById(`script-${i}`);
  const hashEl=document.getElementById(`hash-${i}`);
  const ctaEl=document.getElementById(`cta-${i}`);
  [hookEl,scriptEl,hashEl,ctaEl].forEach(el=>{if(el)el.style.opacity='.4';});

  const prompt = [
    `쇼핑쇼츠 카피라이터야. "${name}" 상품으로 새로운 각도의 쇼핑쇼츠 대본 1개를 만들어줘.`,
    `음성/톤: ${voiceName} — ${voiceDesc}`,
    '이전 대본과 완전히 다른 접근 방식으로.',
    '',
    '{"angle":"각도명","hook":"훅 1-2문장","script":"15-30초 대본","hashtags":"해시태그 10개","cta":"CTA 2가지"}'
  ].join('\n');

  try {
    const raw = await callClaude(prompt, 1200);
    const d = parseJSON(raw);
    if(hookEl) hookEl.value=d.hook||'';
    if(scriptEl){ scriptEl.value=d.script||''; scriptEl.style.fontSize=curSubtitleSize+'px'; }
    if(hashEl) hashEl.value=d.hashtags||'';
    if(ctaEl) ctaEl.value=d.cta||'';
    const badge=document.querySelector(`#sp-${i} .angle-badge`);
    if(badge&&d.angle) badge.textContent=d.angle;
  } catch(e){ alert('재생성 실패: '+e.message); }
  finally { [hookEl,scriptEl,hashEl,ctaEl].forEach(el=>{if(el)el.style.opacity='1';}); }
}

function copySec(id, btn){
  const el=document.getElementById(id);
  if(!el) return;
  navigator.clipboard.writeText(el.value).then(()=>{
    const orig=btn.textContent; btn.textContent='✓ 복사됨';
    setTimeout(()=>btn.textContent=orig, 1500);
  });
}

function copyAll(i){
  const h=document.getElementById(`hook-${i}`)?.value||'';
  const s=document.getElementById(`script-${i}`)?.value||'';
  const hh=document.getElementById(`hash-${i}`)?.value||'';
  const c=document.getElementById(`cta-${i}`)?.value||'';
  const text=[`[훅]\n${h}`,`\n[스크립트]\n${s}`,`\n[해시태그]\n${hh}`,`\n[CTA]\n${c}`].join('\n');
  navigator.clipboard.writeText(text).then(()=>{
    const btn=document.querySelector(`#sp-${i} .btn-sm.green`);
    if(btn){const o=btn.textContent;btn.textContent='✓ 복사됨';setTimeout(()=>btn.textContent=o,1500);}
  });
}

// ── 바이럴 자동연동 ───────────────────────────────────────
function getPlatInfo(url){
  if(/youtube\.com|youtu\.be/.test(url)) return {name:'YouTube',badge:'badge-yt',icon:'▶️'};
  if(/tiktok\.com/.test(url)) return {name:'TikTok',badge:'badge-tt',icon:'🎵'};
  if(/instagram\.com/.test(url)) return {name:'Instagram',badge:'badge-ig',icon:'📸'};
  return {name:'영상',badge:'',icon:'🎬'};
}
async function getYtTitle(url){
  try{ const r=await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent(url)}&format=json`); const d=await r.json(); return d.title||''; }catch{return '';}
}
function getProdEmoji(name){
  const kws=[[/커피|드립|머신|포트/,'☕'],[/냄비|프라이팬|식기|그릇|밥솥/,'🍳'],[/청소|세정|탈취|방향/,'🧹'],[/수납|정리|박스|용기|밀폐/,'📦'],[/크림|세럼|마스크팩|로션|토너|선크림|파운데이션|립|뷰티|스킨|화장/,'💄'],[/샴푸|컨디셔너|헤어|드라이어|에어랩/,'💇'],[/필라테스|요가|덤벨|헬스|운동/,'💪'],[/노트북|맥북|태블릿|아이패드|스마트폰|폰|이어폰|에어팟/,'💻'],[/소파|의자|책상|침대|가구/,'🛋'],[/램프|조명|무드등/,'💡'],[/강아지|고양이|반려|펫/,'🐾'],[/원피스|티셔츠|후드|패딩|가방|지갑/,'👗'],[/비타민|영양제|유산균|단백질|프로틴/,'💊'],[/커튼|이불|베개|홈/,'🏠']];
  for(const[re,e]of kws)if(re.test(name))return e;
  return '🛍';
}

async function analyzeViral(){
  const single=document.getElementById('viralUrl').value.trim();
  const multi=document.getElementById('viralUrls').value.trim();
  const allUrls=[...new Set([single,...multi.split('\n').map(s=>s.trim())].filter(Boolean))];
  if(!allUrls.length){alert('링크를 입력해줘.');return;}
  if(!getKey()){openSettings();return;}
  const btn=document.getElementById('viralBtn');
  btn.disabled=true; btn.innerHTML='<div class="spinner"></div> 분석 중...';
  document.getElementById('viralResult').innerHTML='<div class="loading-overlay"><div class="sp"></div><div>상품 감지 중...</div></div>';
  try{
    const results=await Promise.all(allUrls.map(u=>analyzeOneUrl(u)));
    document.getElementById('viralResult').innerHTML=results.join('');
  }catch(e){
    document.getElementById('viralResult').innerHTML=`<div style="color:#ff6b8a;padding:12px;font-size:13px">오류: ${e.message}</div>`;
  }finally{btn.disabled=false;btn.innerHTML='🔍 상품 감지 + 쿠팡 자동연동';}
}

async function analyzeOneUrl(url){
  const plat=getPlatInfo(url);
  let title='';
  if(/youtube\.com|youtu\.be/.test(url)) title=await getYtTitle(url);
  const prompt=['아래 영상 링크/제목에서 등장할 만한 상품들을 감지해서 JSON으로만 반환해.',`URL: ${url}`,title?`영상 제목: ${title}`:'','{"products":[{"name":"구체적상품명","category":"카테고리","price_range":"가격대","hook":"바이럴 훅 1줄"}]}','상품 최대 3개. 쿠팡 검색 가능한 구체적인 상품명으로.'].filter(Boolean).join('\n');
  const raw=await callClaude(prompt,600);
  const d=parseJSON(raw);
  const products=d.products||[];
  if(!products.length){
    return `<div class="card" style="margin-bottom:8px;color:var(--sub);font-size:13px">${plat.icon} <span class="badge ${plat.badge}">${plat.name}</span> 상품 감지 실패<div style="font-size:11px;margin-top:4px;word-break:break-all;color:var(--sub)">${url}</div></div>`;
  }
  const prods=products.map(p=>{
    const emoji=getProdEmoji(p.name);
    const searchUrl=coupangSearchUrl(p.name);
    const deep=coupangDeepLink(p.name);
    const linkHtml=deep?`<a class="prod-link" href="${deep}" target="_blank">🛒 쿠팡 딥링크</a>`:`<a class="prod-link" href="${searchUrl}" target="_blank">🛒 쿠팡 검색</a>`;
    return `<div class="prod-card"><div class="prod-emoji">${emoji}</div><div class="prod-info"><div class="prod-name">${p.name}</div><div style="font-size:11px;color:var(--sub);margin-bottom:3px">${p.category} · ${p.price_range}</div><div style="font-size:11px;background:rgba(124,111,255,.1);padding:4px 8px;border-radius:6px;margin-bottom:5px">"${p.hook}"</div>${linkHtml}</div></div>`;
  }).join('');
  return `<div class="card" style="margin-bottom:10px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span>${plat.icon}</span><span class="badge ${plat.badge}">${plat.name}</span>${title?`<span style="font-size:11px;color:var(--sub);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${title}</span>`:''}</div><div style="font-size:10px;color:var(--sub);margin-bottom:8px;word-break:break-all">${url}</div>${prods}</div>`;
}

// ── 설정 ──────────────────────────────────────────────────
function openSettings(){
  document.getElementById('claudeKey').value=LS.get('ss_claude_key');
  document.getElementById('cpAccess').value=LS.get('ss_cp_access');
  document.getElementById('cpSecret').value=LS.get('ss_cp_secret');
  document.getElementById('cpSubid').value=LS.get('ss_cp_subid');
  document.getElementById('settingsModal').classList.add('open');
}
function closeSettings(){document.getElementById('settingsModal').classList.remove('open');}
function closeIfBg(e){if(e.target.id==='settingsModal')closeSettings();}
function saveKey(){
  LS.set('ss_claude_key',document.getElementById('claudeKey').value.trim());
  const s=document.getElementById('keySaved'); s.classList.add('show'); setTimeout(()=>s.classList.remove('show'),2000);
}
function saveCoupang(){
  LS.set('ss_cp_access',document.getElementById('cpAccess').value.trim());
  LS.set('ss_cp_secret',document.getElementById('cpSecret').value.trim());
  LS.set('ss_cp_subid',document.getElementById('cpSubid').value.trim());
  const s=document.getElementById('cpSaved'); s.classList.add('show'); setTimeout(()=>s.classList.remove('show'),2000);
}

// ── 자막 미리보기 연동 ────────────────────────────────────
document.getElementById('prodName').addEventListener('input',()=>{
  if(document.getElementById('captionPreview').style.display!=='none') updateCaptionPreview();
});
