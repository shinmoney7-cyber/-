name: Auto Order

on:
  push:
    branches: [main]
    paths: ['.github/workflows/auto_order.yml']
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  process-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright pypdf anthropic
          playwright install chromium
          playwright install-deps chromium

      - name: Process orders
        env:
          GMAIL_USER: shinmoney7@gmail.com
          GMAIL_APP_PASSWORD: "${{ secrets.GMAIL_APP_PASSWORD }}"
          FL_ID: "${{ secrets.FL_ID }}"
          FL_PW: "${{ secrets.FL_PW }}"
          ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"
          SOLAPI_API_KEY: "${{ secrets.SOLAPI_API_KEY }}"
          SOLAPI_API_SECRET: "${{ secrets.SOLAPI_API_SECRET }}"
          NOTIFY_PHONE: "${{ secrets.NOTIFY_PHONE }}"
        run: python scripts/check_orders.py

      - name: Deliver FL PDFs to customers
        env:
          GMAIL_USER: shinmoney7@gmail.com
          GMAIL_APP_PASSWORD: "${{ secrets.GMAIL_APP_PASSWORD }}"
          SOLAPI_API_KEY: "${{ secrets.SOLAPI_API_KEY }}"
          SOLAPI_API_SECRET: "${{ secrets.SOLAPI_API_SECRET }}"
          SOLAPI_FROM: "${{ secrets.NOTIFY_PHONE }}"
          NOTIFY_PHONE: "${{ secrets.NOTIFY_PHONE }}"
        run: python scripts/deliver_pdf.py
