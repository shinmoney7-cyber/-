name: Auto Order

on:
  push:
    branches: [main]
    paths: ['.github/workflows/auto_order.yml']
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  process-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Process orders
        env:
          GMAIL_USER: shinmoney7@gmail.com
          GMAIL_APP_PASSWORD: "${{ secrets.GMAIL_APP_PASSWORD }}"
          FL_ID: "${{ secrets.FL_ID }}"
          FL_PW: "${{ secrets.FL_PW }}"
          ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"
        run: python scripts/check_orders.py
