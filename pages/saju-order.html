<title>사주마루 주문</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Inter:wght@400;500;600&display=swap">

<style>
/*
  Layout: 상품 카탈로그 → 선택 → 바텀시트 주문 폼
  다크 신비 톤 / 금색 포인트 / 모바일 우선
*/
:root {
  --bg: #0C0A14;
  --surface: #161327;
  --surface2: #1F1B33;
  --border: #2A2545;
  --gold: #C8A84B;
  --gold-dim: rgba(200,168,75,0.12);
  --gold-glow: rgba(200,168,75,0.25);
  --fg: #EDE9FF;
  --fg2: #9B94BA;
  --fg3: #5E587A;
  --success: #52C97A;
  --r: 12px;
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Inter', 'Apple SD Gothic Neo', sans-serif;
  margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}

/* ── Header ── */
.header {
  text-align: center;
  padding: 36px 0 8px;
}
.header .brand {
  font-size: 0.7rem;
  letter-spacing: 0.18em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.header h1 {
  font-family: 'Noto Serif KR', serif;
  font-size: 1.45rem;
  font-weight: 600;
  color: var(--fg);
  margin: 0 0 6px;
  text-wrap: balance;
}
.header p {
  font-size: 0.78rem;
  color: var(--fg3);
  margin: 0 0 20px;
}

/* ── Tabs ── */
.tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 16px;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0;
  padding: 6px 15px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--fg2);
  font-size: 0.78rem;
  cursor: pointer;
  transition: all .2s;
  font-family: inherit;
}
.tab.active {
  background: var(--gold-dim);
  border-color: var(--gold);
  color: var(--gold);
}

/* ── Product Cards ── */
.products {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-bottom: 40px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 15px;
  display: flex;
  gap: 14px;
  align-items: center;
  cursor: pointer;
  transition: border-color .2s, background .2s;
  -webkit-tap-highlight-color: transparent;
}
.card:hover, .card:focus-visible {
  border-color: var(--gold);
  background: var(--surface2);
  outline: none;
}
.card-icon {
  width: 54px;
  height: 54px;
  border-radius: 10px;
  background: var(--gold-dim);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  flex-shrink: 0;
  border: 1px solid var(--border);
}
.card-info { flex: 1; min-width: 0; }
.card-cat {
  font-size: 0.68rem;
  color: var(--fg3);
  letter-spacing: 0.04em;
  margin-bottom: 2px;
}
.card-name {
  font-family: 'Noto Serif KR', serif;
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--fg);
  margin: 0 0 3px;
}
.card-desc {
  font-size: 0.72rem;
  color: var(--fg2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.card-right { flex-shrink: 0; text-align: right; }
.card-price {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
}
.card-arrow {
  font-size: 0.75rem;
  color: var(--fg3);
  margin-top: 2px;
}

/* ── Form Overlay ── */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(5,3,12,0.75);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.sheet {
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-height: 92vh;
  overflow-y: auto;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) max(28px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  border-top: 1px solid var(--border);
}
.handle-wrap {
  position: sticky;
  top: 0;
  background: var(--surface);
  padding: 14px 0 10px;
  z-index: 10;
}
.handle {
  width: 36px;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 0 auto;
}

/* Selected product mini-header */
.order-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}
.order-icon {
  width: 44px;
  height: 44px;
  border-radius: 9px;
  background: var(--gold-dim);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
  flex-shrink: 0;
}
.order-title { flex: 1; min-width: 0; }
.order-title h3 {
  font-family: 'Noto Serif KR', serif;
  font-size: 0.9rem;
  font-weight: 600;
  margin: 0 0 2px;
}
.order-title span { font-size: 0.72rem; color: var(--fg3); }
.order-price {
  font-size: 1rem;
  font-weight: 600;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
}

/* Form Fields */
.field { margin-bottom: 15px; }
.field > label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.75rem;
  color: var(--fg2);
  margin-bottom: 7px;
  letter-spacing: 0.02em;
}
.field .hint { color: var(--fg3); font-size: 0.68rem; }

.field input, .field select {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--fg);
  font-size: 0.88rem;
  padding: 10px 12px;
  outline: none;
  transition: border-color .2s;
  font-family: inherit;
  -webkit-appearance: none;
  appearance: none;
}
.field input:focus, .field select:focus { border-color: var(--gold); }
.field input::placeholder { color: var(--fg3); }

.row { display: grid; gap: 8px; }
.row-3 { grid-template-columns: 86px 1fr 1fr; }
.row-date { grid-template-columns: 1.3fr 1fr 1fr; }

/* Toggle buttons */
.btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
.tog {
  flex: 1;
  min-width: 60px;
  padding: 10px 6px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--fg2);
  font-size: 0.82rem;
  cursor: pointer;
  text-align: center;
  transition: all .2s;
  font-family: inherit;
}
.tog.on {
  border-color: var(--gold);
  background: var(--gold-dim);
  color: var(--gold);
}

/* Submit */
.submit-btn {
  width: 100%;
  padding: 14px;
  background: var(--gold);
  color: #0C0A14;
  font-weight: 600;
  font-size: 0.92rem;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  margin-top: 10px;
  font-family: inherit;
  transition: opacity .2s;
  letter-spacing: 0.02em;
}
.submit-btn:active { opacity: 0.85; }

/* Success */
.done {
  text-align: center;
  padding: 28px 8px 8px;
}
.done-icon { font-size: 2.8rem; margin-bottom: 14px; }
.done h3 {
  font-family: 'Noto Serif KR', serif;
  font-size: 1.1rem;
  color: var(--gold);
  margin: 0 0 8px;
}
.done p {
  font-size: 0.82rem;
  color: var(--fg2);
  line-height: 1.65;
  margin: 0 0 22px;
}
.kakao-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 22px;
  background: #FEE500;
  color: #191919;
  border-radius: 10px;
  font-weight: 600;
  font-size: 0.88rem;
  text-decoration: none;
  font-family: inherit;
}
.back-btn {
  display: block;
  margin: 12px auto 0;
  background: none;
  border: none;
  color: var(--fg3);
  font-size: 0.78rem;
  cursor: pointer;
  font-family: inherit;
  text-decoration: underline;
}

[hidden] { display: none !important; }
</style>

<!-- 상품 목록 -->
<div id="list-view">
  <div class="header">
    <div class="brand">사주마루 · 사주보는언니</div>
    <h1>나의 사주, 지금 풀어봐</h1>
    <p>원하는 상품을 선택하면 주문 폼이 열려</p>
  </div>

  <div class="tabs" role="tablist" id="tab-bar"></div>
  <div class="products" id="product-list"></div>
</div>

<!-- 주문 폼 오버레이 -->
<div class="overlay" id="overlay" hidden>
  <div class="sheet" id="sheet">
    <div class="handle-wrap">
      <div class="handle"></div>
    </div>

    <div class="order-header">
      <div class="order-icon" id="o-icon"></div>
      <div class="order-title">
        <h3 id="o-name"></h3>
        <span id="o-cat"></span>
      </div>
      <div class="order-price" id="o-price"></div>
    </div>

    <!-- 주문 폼 -->
    <div id="form-wrap">
      <form id="order-form" onsubmit="doSubmit(event)" novalidate>

        <div class="field">
          <label>이름 <span class="hint">(개명하셨다면 개명 후 성함)</span></label>
          <input type="text" id="f-name" placeholder="홍길동" required>
        </div>

        <div class="field">
          <label>연락처 <span class="hint">(이 번호 카카오톡으로 풀이를 보내드려)</span></label>
          <div class="row row-3">
            <select id="f-p0">
              <option>010</option><option>011</option><option>016</option><option>017</option><option>019</option>
            </select>
            <input type="tel" id="f-p1" placeholder="1234" maxlength="4" inputmode="numeric" required>
            <input type="tel" id="f-p2" placeholder="5678" maxlength="4" inputmode="numeric" required>
          </div>
        </div>

        <div class="field">
          <label>생년월일</label>
          <div class="row row-date" id="dob-row"></div>
        </div>

        <div class="field">
          <label>양력 / 음력</label>
          <div class="btn-group" id="grp-lunar">
            <button type="button" class="tog on" data-val="양력">양력</button>
            <button type="button" class="tog" data-val="음력">음력</button>
            <button type="button" class="tog" data-val="음력(윤달)">음력(윤달)</button>
          </div>
        </div>

        <div class="field">
          <label>성별</label>
          <div class="btn-group" id="grp-gender">
            <button type="button" class="tog on" data-val="여성">여성</button>
            <button type="button" class="tog" data-val="남성">남성</button>
          </div>
        </div>

        <div class="field">
          <label>태어난 시간 <span class="hint">(모르시면 비워둬도 돼)</span></label>
          <select id="f-time">
            <option value="">모름</option>
            <option>00시 (자시 초)</option><option>01시</option><option>02시 (축시)</option><option>03시</option>
            <option>04시 (인시)</option><option>05시</option><option>06시 (묘시)</option><option>07시</option>
            <option>08시 (진시)</option><option>09시</option><option>10시 (사시)</option><option>11시</option>
            <option>12시 (오시)</option><option>13시</option><option>14시 (미시)</option><option>15시</option>
            <option>16시 (신시)</option><option>17시</option><option>18시 (유시)</option><option>19시</option>
            <option>20시 (술시)</option><option>21시</option><option>22시 (해시)</option><option>23시</option>
          </select>
        </div>

        <div class="field">
          <label>이메일 <span class="hint">(선택)</span></label>
          <input type="email" id="f-email" placeholder="email@example.com">
        </div>

        <button type="submit" class="submit-btn" id="submit-btn">주문하기 →</button>
      </form>
    </div>

    <!-- 완료 화면 -->
    <div id="done-wrap" hidden class="done">
      <div class="done-icon">🌟</div>
      <h3>주문이 접수됐어!</h3>
      <p>입금 확인 후 카카오톡으로<br>사주풀이를 보내드릴게.<br><br>
        <strong style="color:var(--fg)">입금 계좌</strong><br>
        <span style="color:var(--gold);font-size:0.9rem">카카오채널에서 안내받아줘</span>
      </p>
      <a class="kakao-btn" id="kakao-link" href="https://pf.kakao.com/_pixgNn" target="_blank">
        💬 카카오채널 바로가기
      </a>
      <button class="back-btn" onclick="closeOverlay()">다른 상품 보기</button>
    </div>

  </div>
</div>

<script>
const PRODUCTS = [
  { id:'종합사주', icon:'🌌', cat:'종합·인생', name:'정통 종합사주', desc:'나의 바탕부터 관계, 생활과 시간의 흐름까지', price:39900, kakao:'https://pf.kakao.com/_pixgNn' },
  { id:'인생사주', icon:'🌠', cat:'종합·인생', name:'인생사주', desc:'나의 강점과 인생의 전환을 함께 살펴봐요', price:34900, kakao:'https://pf.kakao.com/_pixgNn' },
  { id:'연애운',  icon:'💕', cat:'사랑·관계', name:'연애운', desc:'나의 연애 성향과 인연의 흐름 분석', price:17000, kakao:'https://pf.kakao.com/_VjvNX' },
  { id:'결혼운',  icon:'💍', cat:'사랑·관계', name:'결혼운', desc:'인연과 혼인의 시기, 배우자 사주 분석', price:29900, kakao:'https://pf.kakao.com/_VjvNX' },
  { id:'재물운',  icon:'💰', cat:'돈·일', name:'재물운', desc:'재물의 흐름과 돈이 들어오는 시기', price:17000, kakao:'https://pf.kakao.com/_pixgNn' },
  { id:'직장운',  icon:'💼', cat:'돈·일', name:'직장·사업운', desc:'직장 적성과 사업 성공의 흐름', price:24900, kakao:'https://pf.kakao.com/_pixgNn' },
  { id:'건강운',  icon:'🌿', cat:'건강', name:'건강운', desc:'건강 취약 부위와 에너지 흐름 분석', price:19900, kakao:'https://pf.kakao.com/_pixgNn' },
  { id:'자녀운',  icon:'👶', cat:'사랑·관계', name:'자녀운', desc:'자녀와의 인연과 자녀 성향 분석', price:17000, kakao:'https://pf.kakao.com/_pixgNn' },
  { id:'수능운',  icon:'📚', cat:'돈·일', name:'수능 합격운', desc:'시험운과 합격 가능성, 목표 대학 분석', price:17000, kakao:'https://pf.kakao.com/_pixgNn' },
  { id:'재회운',  icon:'💞', cat:'사랑·관계', name:'재회운', desc:'헤어진 인연과의 재회 가능성 분석', price:24900, kakao:'https://pf.kakao.com/_VjvNX' },
];

const CATS = ['전체','종합·인생','사랑·관계','돈·일','건강'];
let activeCat = '전체';
let selected = null;

// Build tabs
const tabBar = document.getElementById('tab-bar');
CATS.forEach(c => {
  const b = document.createElement('button');
  b.className = 'tab' + (c==='전체'?' active':'');
  b.textContent = c;
  b.onclick = () => {
    activeCat = c;
    document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active', CATS[i]===c));
    renderProducts();
  };
  tabBar.appendChild(b);
});

// Build year/month/day selects
function buildDOB() {
  const row = document.getElementById('dob-row');
  const yr = document.createElement('select'); yr.id='f-y'; yr.required=true;
  yr.innerHTML = '<option value="">-년-</option>' +
    Array.from({length:80},(_,i)=>{const y=new Date().getFullYear()-i; return `<option>${y}</option>`;}).join('');
  const mo = document.createElement('select'); mo.id='f-m'; mo.required=true;
  mo.innerHTML = '<option value="">-월-</option>' +
    Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}월</option>`).join('');
  const dy = document.createElement('select'); dy.id='f-d'; dy.required=true;
  dy.innerHTML = '<option value="">-일-</option>' +
    Array.from({length:31},(_,i)=>`<option value="${i+1}">${i+1}일</option>`).join('');
  row.append(yr, mo, dy);
}
buildDOB();

function renderProducts() {
  const list = document.getElementById('product-list');
  const items = activeCat==='전체' ? PRODUCTS : PRODUCTS.filter(p=>p.cat===activeCat);
  list.innerHTML = items.map(p=>`
    <div class="card" tabindex="0" onclick="openForm('${p.id}')" onkeydown="if(event.key==='Enter')openForm('${p.id}')">
      <div class="card-icon">${p.icon}</div>
      <div class="card-info">
        <div class="card-cat">${p.cat}</div>
        <div class="card-name">${p.name}</div>
        <div class="card-desc">${p.desc}</div>
      </div>
      <div class="card-right">
        <div class="card-price">${p.price.toLocaleString()}원</div>
        <div class="card-arrow">→</div>
      </div>
    </div>
  `).join('');
}

function openForm(id) {
  selected = PRODUCTS.find(p=>p.id===id);
  if (!selected) return;
  document.getElementById('o-icon').textContent = selected.icon;
  document.getElementById('o-name').textContent = selected.name;
  document.getElementById('o-cat').textContent = selected.cat;
  document.getElementById('o-price').textContent = selected.price.toLocaleString() + '원';
  document.getElementById('form-wrap').hidden = false;
  document.getElementById('done-wrap').hidden = true;
  document.getElementById('order-form').reset();
  resetToggles();
  document.getElementById('overlay').hidden = false;
  document.body.style.overflow = 'hidden';
  document.getElementById('sheet').scrollTop = 0;
}

function closeOverlay() {
  document.getElementById('overlay').hidden = true;
  document.body.style.overflow = '';
}

document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closeOverlay();
});

function resetToggles() {
  ['grp-lunar','grp-gender'].forEach(id=>{
    const btns = document.querySelectorAll(`#${id} .tog`);
    btns.forEach((b,i)=>b.classList.toggle('on', i===0));
  });
}

document.querySelectorAll('.btn-group').forEach(grp=>{
  grp.addEventListener('click', e=>{
    const btn = e.target.closest('.tog');
    if (!btn) return;
    grp.querySelectorAll('.tog').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
  });
});

function getLunar() {
  return document.querySelector('#grp-lunar .tog.on')?.dataset.val || '양력';
}
function getGender() {
  return document.querySelector('#grp-gender .tog.on')?.dataset.val || '여성';
}

function doSubmit(e) {
  e.preventDefault();
  const name = document.getElementById('f-name').value.trim();
  const p1 = document.getElementById('f-p1').value.trim();
  const p2 = document.getElementById('f-p2').value.trim();
  if (!name || !p1 || !p2) {
    document.getElementById('f-name').style.borderColor = name ? '' : 'tomato';
    document.getElementById('f-p1').style.borderColor = p1 ? '' : 'tomato';
    document.getElementById('f-p2').style.borderColor = p2 ? '' : 'tomato';
    return;
  }
  const yr = document.getElementById('f-y').value;
  const mo = document.getElementById('f-m').value;
  const dy = document.getElementById('f-d').value;
  if (!yr || !mo || !dy) {
    ['f-y','f-m','f-d'].forEach(id=>{
      document.getElementById(id).style.borderColor = document.getElementById(id).value ? '' : 'tomato';
    });
    return;
  }

  document.getElementById('kakao-link').href = selected.kakao;
  document.getElementById('form-wrap').hidden = true;
  document.getElementById('done-wrap').hidden = false;
  document.getElementById('sheet').scrollTop = 0;
}

renderProducts();
</script>
