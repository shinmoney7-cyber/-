<title>사주 상담 신청</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root {
  --bg: #1a0a3e;
  --card: rgba(255,255,255,0.07);
  --border: rgba(255,255,255,0.14);
  --text: #f0e6ff;
  --dim: #b8a0e0;
  --accent: #a855f7;
  --accent-soft: rgba(168,85,247,0.18);
  --gold: #fbbf24;
  --gold-soft: rgba(251,191,36,0.1);
  --input-bg: rgba(255,255,255,0.06);
  --kakao: #FEE500;
  --kakao-text: #3C1E1E;
  --step-done: #22c55e;
  --step-active: #a855f7;
  --step-idle: rgba(255,255,255,0.15);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f5f0ff;
    --card: #fff;
    --border: rgba(100,60,200,.14);
    --text: #1a0a3e;
    --dim: #6b3fa0;
    --input-bg: rgba(100,60,200,.05);
    --step-idle: rgba(100,60,200,.15);
    color-scheme: light;
  }
}
:root[data-theme="dark"] {
  --bg: #1a0a3e;
  --card: rgba(255,255,255,.07);
  --border: rgba(255,255,255,.14);
  --text: #f0e6ff;
  --dim: #b8a0e0;
  --input-bg: rgba(255,255,255,.06);
  --step-idle: rgba(255,255,255,.15);
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  background-image: radial-gradient(ellipse at top, #2d1066 0%, #1a0a3e 50%, #0d0520 100%);
  color: var(--text);
  min-height: 100vh;
  padding-top: max(0px, env(safe-area-inset-top, 0px));
  padding-bottom: max(80px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ── Top fixed header ── */
.top-header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 50;
  background: rgba(26, 10, 62, 0.92);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px 10px;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 51;
  background: rgba(26,10,62,0.92);
}
.header-inner {
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
}
.header-brand {
  font-size: 16px;
  font-weight: 900;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
}
.header-total {
  font-size: 15px;
  font-weight: 900;
  color: var(--gold);
  white-space: nowrap;
  transition: all .2s;
}

/* ── Step bar ── */
.step-bar {
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  padding: 10px 0 4px;
  gap: 0;
}
.step-item {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  cursor: pointer;
}
.step-item:last-child { flex: none; }
.step-num {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--step-idle);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 900;
  flex-shrink: 0;
  transition: all .2s;
  color: var(--dim);
}
.step-item.done .step-num   { background: var(--step-done); color: #fff; }
.step-item.active .step-num { background: var(--step-active); color: #fff; box-shadow: 0 0 12px rgba(168,85,247,.5); }
.step-label {
  font-size: 11px;
  color: var(--dim);
  font-weight: 700;
  transition: color .2s;
  white-space: nowrap;
}
.step-item.active .step-label { color: var(--text); }
.step-item.done  .step-label  { color: var(--step-done); }
.step-line {
  flex: 1;
  height: 2px;
  background: var(--step-idle);
  margin: 0 6px;
  border-radius: 1px;
  transition: background .2s;
}
.step-line.done { background: var(--step-done); }

/* ── Main ── */
.wrap { max-width: 480px; margin: 0 auto; padding-top: 14px; }

/* ── Step panels ── */
.step-panel { display: none; }
.step-panel.active { display: block; }

/* ── Hours badge ── */
.hours-bar {
  display: flex; align-items: center; gap: 10px;
  background: rgba(251,191,36,.1);
  border: 1px solid rgba(251,191,36,.28);
  border-radius: 12px;
  padding: 9px 14px;
  margin-bottom: 14px;
}
.hours-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #4ade80; box-shadow: 0 0 6px #4ade80;
  animation: pulse 2s infinite; flex-shrink: 0;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.hours-text { font-size: 13px; font-weight: 700; color: var(--gold); }
.hours-sub  { font-size: 11px; color: var(--dim); }

/* ── Card ── */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 18px 16px;
  margin-bottom: 12px;
  backdrop-filter: blur(10px);
}
.card-title {
  font-size: 13px; font-weight: 700; color: var(--accent);
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 6px;
  letter-spacing: .04em;
}

/* ── Menu list ── */
.menu-list { display: flex; flex-direction: column; gap: 8px; }
.menu-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 13px;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  cursor: pointer; transition: all .15s; gap: 10px;
}
.menu-item input[type="checkbox"] { display: none; }
.menu-item.selected { border-color: var(--accent); background: var(--accent-soft); }
.menu-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
.menu-emoji { font-size: 17px; flex-shrink: 0; }
.menu-info  { min-width: 0; }
.menu-name  { font-size: 14px; font-weight: 700; color: var(--text); }
.menu-desc  { font-size: 11px; color: var(--dim); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menu-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.menu-price { font-size: 14px; font-weight: 900; color: var(--gold); }
.check-icon {
  width: 22px; height: 22px; border-radius: 50%;
  border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; flex-shrink: 0; transition: all .15s;
  color: transparent;
}
.menu-item.selected .check-icon { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ── Form ── */
.field { margin-bottom: 12px; }
.field:last-child { margin-bottom: 0; }
label {
  display: block; font-size: 11.5px; font-weight: 700;
  color: var(--dim); margin-bottom: 7px;
  text-transform: uppercase; letter-spacing: .07em;
}
.req::after { content: ' *'; color: #f87171; }
input[type="text"], select, textarea {
  width: 100%; padding: 12px 14px;
  background: var(--input-bg);
  border: 1.5px solid var(--border);
  border-radius: 12px; color: var(--text);
  font-size: 15px; font-family: 'Noto Sans KR', sans-serif;
  outline: none; transition: border-color .2s;
  -webkit-appearance: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
input::placeholder, textarea::placeholder { color: rgba(255,255,255,.26); }
select option { background: #1a0a3e; }
textarea { resize: none; height: 72px; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; }
.pill input { display: none; }
.pill label {
  display: inline-flex; align-items: center;
  padding: 9px 15px; border: 1.5px solid var(--border); border-radius: 20px;
  font-size: 13px; font-weight: 700; color: var(--dim);
  cursor: pointer; transition: all .15s; background: var(--input-bg);
  margin: 0; text-transform: none; letter-spacing: normal;
}
.pill input:checked + label { border-color: var(--accent); background: var(--accent-soft); color: #e9d5ff; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ── Step 3 summary ── */
.summary-section { margin-bottom: 14px; }
.summary-label {
  font-size: 11px; font-weight: 700; color: var(--accent);
  text-transform: uppercase; letter-spacing: .08em;
  margin-bottom: 8px; display: flex; align-items: center; gap: 5px;
}
.summary-items { display: flex; flex-direction: column; gap: 6px; }
.summary-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 13px;
  background: var(--input-bg); border-radius: 10px; border: 1px solid var(--border);
}
.summary-row-name { font-size: 13px; font-weight: 700; color: var(--text); }
.summary-row-price { font-size: 13px; font-weight: 900; color: var(--gold); }
.summary-info-grid {
  display: grid; grid-template-columns: auto 1fr; gap: 6px 12px;
  padding: 12px 14px;
  background: var(--input-bg); border-radius: 12px; border: 1px solid var(--border);
}
.info-key { font-size: 12px; color: var(--dim); font-weight: 700; white-space: nowrap; align-self: start; padding-top: 1px; }
.info-val { font-size: 13px; color: var(--text); font-weight: 500; word-break: break-all; }
.empty-notice {
  font-size: 13px; color: var(--dim); text-align: center; padding: 16px;
  background: var(--input-bg); border-radius: 10px; border: 1px dashed var(--border);
}

/* ── Total bar ── */
.total-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 13px 16px;
  background: var(--gold-soft);
  border: 1px solid rgba(251,191,36,.28);
  border-radius: 14px;
  margin-bottom: 12px;
}
.total-label  { font-size: 14px; font-weight: 700; color: var(--dim); }
.total-amount { font-size: 22px; font-weight: 900; color: var(--gold); }

/* ── Nav buttons ── */
.nav-row { display: flex; gap: 10px; margin-top: 4px; }
.btn-prev {
  flex: 0 0 auto;
  padding: 15px 20px;
  background: var(--input-bg);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  color: var(--dim); font-size: 15px; font-weight: 700;
  font-family: 'Noto Sans KR', sans-serif;
  cursor: pointer; transition: all .15s;
}
.btn-prev:hover { border-color: var(--accent); color: var(--text); }
.btn-next {
  flex: 1;
  padding: 15px;
  background: var(--accent);
  border: none; border-radius: 14px;
  color: #fff; font-size: 15px; font-weight: 900;
  font-family: 'Noto Sans KR', sans-serif;
  cursor: pointer; transition: transform .1s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-next:active { transform: scale(.97); }
.send-btn {
  width: 100%; padding: 16px;
  background: var(--kakao); color: var(--kakao-text);
  border: none; border-radius: 16px;
  font-size: 16px; font-weight: 900;
  font-family: 'Noto Sans KR', sans-serif;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .1s; letter-spacing: -.02em;
}
.send-btn:active { transform: scale(.97); }
.hint {
  text-align: center; font-size: 11.5px;
  color: var(--dim); margin-top: 10px; line-height: 1.8;
}

/* ── Empty selection indicator on step 1 ── */
.select-count-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 14px;
  background: var(--accent-soft);
  border: 1px solid rgba(168,85,247,.3);
  border-radius: 10px; margin-bottom: 12px;
  font-size: 13px; font-weight: 700;
  transition: all .2s;
}
.select-count-bar.hidden { display: none; }
.select-count-items { color: var(--text); }
.select-count-total { color: var(--gold); }

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: max(60px, calc(env(safe-area-inset-bottom,0px) + 20px));
  left: 50%; transform: translateX(-50%) translateY(14px);
  background: rgba(10,4,30,.94);
  border: 1px solid var(--border); color: white;
  padding: 11px 22px; border-radius: 22px;
  font-size: 13px; font-weight: 700;
  opacity: 0; transition: all .25s;
  pointer-events: none; white-space: nowrap; z-index: 999;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

      <input type="text" id="currentCity" placeholder="예) 서울 마포, 경기 수원">

        <div class="pill"><input type="radio" name="recv" id="rs" value="문자(SMS)"><label for="rs">📱 문자</label></div>

  <div class="nav-row">

<!-- ══════════════ STEP 3 — 최종 확인 & 신청 ══════════════ -->
<div class="step-panel" id="panel3">

  <div class="card">
    <div class="card-title">📋 신청 내용 한눈에 보기</div>

    <!-- 선택 메뉴 요약 -->
    <div class="summary-section">
      <div class="summary-label">🔮 선택한 항목</div>
      <div class="summary-items" id="summaryItems">
        <div class="empty-notice">선택된 항목이 없습니다</div>
      </div>
    </div>

    <!-- 의뢰인 정보 요약 -->
    <div class="summary-section">
      <div class="summary-label">👤 의뢰인 정보</div>
      <div class="summary-info-grid" id="summaryInfo">
        <span class="info-key">이름</span><span class="info-val" id="s-name">—</span>
        <span class="info-key">성별</span><span class="info-val" id="s-gender">—</span>
        <span class="info-key">생년월일</span><span class="info-val" id="s-birth">—</span>
        <span class="info-key">태어난 시</span><span class="info-val" id="s-btime">—</span>
        <span class="info-key">출생지</span><span class="info-val" id="s-birthplace">—</span>
        <span class="info-key">현재 거주</span><span class="info-val" id="s-city">—</span>
        <span class="info-key">전달 방법</span><span class="info-val" id="s-recv">—</span>
        <span class="info-key">질문</span><span class="info-val" id="s-q">—</span>
      </div>
    </div>
  </div>

  <!-- 합계 -->
  <div class="total-bar">
    <span class="total-label">💳 결제 예상 금액</span>
    <span class="total-amount" id="totalAmt">0원</span>
  </div>

  <button class="send-btn" onclick="send()">
    <svg width="22" height="22" viewBox="0 0 24 24"><ellipse cx="12" cy="11" rx="10" ry="7.5" fill="#3C1E1E"/><path d="M8 15l-2 4 8-5" fill="#FEE500"/></svg>
    카카오톡으로 신청하기
  </button>

  <p class="hint">
    버튼을 누르면 메시지가 자동으로 만들어져요<br>
    @사주마루 채널에 붙여넣기 후 전송하면 끝 🙏
  </p>

  <div class="nav-row" style="margin-top:14px">
    <button class="btn-prev" onclick="goStep(2)">← 정보 수정</button>
    <button class="btn-prev" style="flex:1" onclick="goStep(1)">메뉴 변경</button>
  </div>
</div>

</div><!-- .wrap -->

<div class="toast" id="toast"></div>

<script>
const KAKAO_URL = 'https://pf.kakao.com/_xnKExn';
let currentStep = 1;

/* ── 메뉴 토글 ── */
document.querySelectorAll('.menu-item').forEach(item => {
  item.addEventListener('click', () => {
    const cb = item.querySelector('input[type="checkbox"]');
    cb.checked = !cb.checked;
    item.classList.toggle('selected', cb.checked);
    updateTotal();
  });
});

function updateTotal() {
  const selected = [...document.querySelectorAll('.menu-item.selected')];
  const total = selected.reduce((s, el) => s + parseInt(el.dataset.price), 0);
  const fmtTotal = total.toLocaleString() + '원';

  document.getElementById('totalAmt').textContent = fmtTotal;
  document.getElementById('headerTotal').textContent = fmtTotal;

  const bar = document.getElementById('selectCountBar');
  const cnt = selected.length;
  if (cnt > 0) {
    bar.classList.remove('hidden');
    document.getElementById('selectCountItems').textContent = cnt + '개 선택됨';
    document.getElementById('selectCountTotal').textContent = fmtTotal;
  } else {
    bar.classList.add('hidden');
  }
}

/* ── 단계 이동 ── */
function goStep(n) {
  document.getElementById('panel' + currentStep).classList.remove('active');
  document.getElementById('panel' + n).classList.add('active');

  // step indicator update
  for (let i = 1; i <= 3; i++) {
    const si = document.getElementById('si' + i);
    const sn = document.getElementById('sn' + i);
    si.classList.remove('active', 'done');
    if (i < n)      { si.classList.add('done'); sn.textContent = '✓'; }
    else if (i === n) { si.classList.add('active'); sn.textContent = i; }
    else              { sn.textContent = i; }
  }
  for (let i = 1; i <= 2; i++) {
    document.getElementById('sl' + i).classList.toggle('done', i < n);
  }

  currentStep = n;
  window.scrollTo({ top: 0, behavior: 'smooth' });

  if (n === 3) buildSummary();
}

/* ── 단계 유효성 검사 후 이동 ── */
function nextStep(from) {
  if (from === 1) {
    const cnt = document.querySelectorAll('.menu-item.selected').length;
    if (!cnt) { toast('⚠️ 상담 항목을 하나 이상 선택해줘요'); return; }
    goStep(2);
  } else if (from === 2) {
    const name   = document.getElementById('name').value.trim();
    const gender = document.querySelector('input[name="gender"]:checked');
    const birth  = document.getElementById('birth').value.trim();
    if (!name)   { toast('⚠️ 이름을 입력해줘요'); return; }
    if (!gender) { toast('⚠️ 성별을 선택해줘요'); return; }
    if (!birth)  { toast('⚠️ 생년월일을 입력해줘요'); return; }
    goStep(3);
  }
}

/* ── Step 3 요약 빌드 ── */
function buildSummary() {
  // 선택 항목
  const selected = [...document.querySelectorAll('.menu-item.selected')];
  const container = document.getElementById('summaryItems');
  if (selected.length === 0) {
    container.innerHTML = '<div class="empty-notice">선택된 항목이 없습니다</div>';
  } else {
    container.innerHTML = selected.map(el => {
      const name  = el.querySelector('.menu-name').textContent;
      const emoji = el.querySelector('.menu-emoji').textContent;
      const price = parseInt(el.dataset.price).toLocaleString() + '원';
      return `<div class="summary-row"><span class="summary-row-name">${emoji} ${name}</span><span class="summary-row-price">${price}</span></div>`;
    }).join('');
  }

  // 의뢰인 정보
  const cal = document.querySelector('input[name="cal"]:checked')?.value || '양력';
  document.getElementById('s-name').textContent      = document.getElementById('name').value || '—';
  document.getElementById('s-gender').textContent    = document.querySelector('input[name="gender"]:checked')?.value || '—';
  document.getElementById('s-birth').textContent     = (document.getElementById('birth').value || '—') + ' (' + cal + ')';
  document.getElementById('s-btime').textContent     = document.getElementById('btime').value || '모름';
  document.getElementById('s-birthplace').textContent= document.getElementById('birthplace').value || '—';
  document.getElementById('s-city').textContent      = document.getElementById('currentCity').value || '—';
  document.getElementById('s-recv').textContent      = document.querySelector('input[name="recv"]:checked')?.value || '—';
  document.getElementById('s-q').textContent         = document.getElementById('q').value || '—';
}

/* ── 메시지 빌드 & 발송 ── */
function fmt() {
  const selected = [...document.querySelectorAll('.menu-item.selected')];
  const name     = document.getElementById('name').value.trim();
  const gender   = document.querySelector('input[name="gender"]:checked')?.value || '';
  const birth    = document.getElementById('birth').value.trim();
  const cal      = document.querySelector('input[name="cal"]:checked')?.value || '양력';
  const btime    = document.getElementById('btime').value;
  const birthplace  = document.getElementById('birthplace').value.trim();
  const currentCity = document.getElementById('currentCity').value.trim();
  const recv     = document.querySelector('input[name="recv"]:checked')?.value || '카카오톡';
  const q        = document.getElementById('q').value.trim();
  const prices   = selected.map(el => `  • ${el.querySelector('.menu-name').textContent} ${parseInt(el.dataset.price).toLocaleString()}원`);
  const total    = selected.reduce((s, el) => s + parseInt(el.dataset.price), 0);

  let m = '📋 사주 상담 신청합니다\n';
  m += '─────────────────\n';
  m += `👤 이름: ${name}\n`;
  m += `⚧ 성별: ${gender}\n`;
  m += `🎂 생년월일: ${birth} (${cal})\n`;
  if (btime) m += `⏰ 태어난 시: ${btime}\n`;
  if (birthplace)  m += `📍 출생지: ${birthplace}\n`;
  if (currentCity) m += `🏠 현재 거주지: ${currentCity}\n`;
  m += `📩 결과 방법: ${recv}\n`;
  m += '─────────────────\n';
  m += `🔮 신청 메뉴:\n`;
  prices.forEach(p => m += p + '\n');
  m += `💳 합계: ${total.toLocaleString()}원\n`;
  m += '─────────────────';
  if (q) m += `\n💬 질문:\n${q}`;
  return m;
}

async function send() {
  const selected = [...document.querySelectorAll('.menu-item.selected')];
  if (!selected.length) { toast('⚠️ 상담 항목을 선택해줘요'); return; }
  const text = fmt();

  if (navigator.share) {
    try { await navigator.share({ text }); return; }
    catch(e) { if (e.name === 'AbortError') return; }
  }
  try {
    await navigator.clipboard.writeText(text);
  } catch(e) {
    const ta = Object.assign(document.createElement('textarea'), { value: text, style: 'position:fixed;opacity:0' });
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast('📋 복사 완료! 카카오톡에 붙여넣기 후 전송해주세요', 3000);
  setTimeout(() => window.open(KAKAO_URL, '_blank'), 600);
}

function toast(msg, dur = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}
</script>
