<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>무료 기초 사주 — 사주마루</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap">
<style>
:root {
  --bg: #fff;
  --bg2: #f8f5ff;
  --fg: #1a0a3e;
  --fg2: #4a3070;
  --fg3: #9380b0;
  --accent: #7b2fff;
  --gold: #c8960a;
  --border: #e8e0f5;
  --green: #16a34a;
  --card: #fff;
  --red: #dc2626;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0620; --bg2: #180a38; --fg: #f0e6ff; --fg2: #c9aeff;
    --fg3: #8060b0; --accent: #a855f7; --gold: #fbbf24;
    --border: #2d1a5e; --green: #4ade80; --card: #1a0a3e; --red: #f87171;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0620; --bg2: #180a38; --fg: #f0e6ff; --fg2: #c9aeff;
  --fg3: #8060b0; --accent: #a855f7; --gold: #fbbf24;
  --border: #2d1a5e; --green: #4ade80; --card: #1a0a3e; --red: #f87171;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--fg);
  min-height: 100vh;
  padding: max(20px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(60px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));
}
.wrap { max-width: 480px; margin: 0 auto; }
.header { text-align: center; padding: 8px 0 20px; }
.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--fg3); text-decoration: none;
  padding: 6px 0; margin-bottom: 12px;
}
.header h1 { font-size: 24px; font-weight: 900; color: var(--fg); margin-bottom: 6px; }
.header p { font-size: 14px; color: var(--fg2); line-height: 1.6; }
.free-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(22,163,74,.12); border: 1.5px solid rgba(22,163,74,.4);
  border-radius: 20px; padding: 5px 14px;
  font-size: 13px; font-weight: 700; color: var(--green);
  margin-bottom: 16px;
}
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 16px; padding: 20px; margin-bottom: 16px;
}
.card h2 { font-size: 14px; font-weight: 800; color: var(--fg2); margin-bottom: 14px; text-transform: uppercase; letter-spacing: .05em; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 700; color: var(--fg2); margin-bottom: 6px; }
.field input, .field select {
  width: 100%; padding: 11px 14px; border: 1.5px solid var(--border);
  border-radius: 10px; font-size: 15px; background: var(--bg2);
  color: var(--fg); font-family: inherit; outline: none;
  transition: border-color .15s;
}
.field input:focus, .field select:focus { border-color: var(--accent); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hint { font-size: 11px; color: var(--fg3); margin-top: 4px; }
.info-box {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 16px; margin-bottom: 16px;
  font-size: 13px; color: var(--fg2); line-height: 1.7;
}
.info-box strong { color: var(--accent); }
.btn-confirm {
  width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
  background: var(--accent); color: #fff;
  border: none; border-radius: 14px; padding: 16px;
  font-size: 17px; font-weight: 900; cursor: pointer;
  font-family: inherit; box-shadow: 0 4px 16px rgba(123,47,255,.35);
  transition: transform .1s, box-shadow .1s;
  margin-bottom: 12px;
}
.btn-confirm:active { transform: scale(.98); }

/* 결과 섹션 */
.result-section {
  display: none;
  background: var(--card); border: 1.5px solid var(--accent);
  border-radius: 16px; padding: 20px; margin-bottom: 16px;
}
.result-section.show { display: block; }
.result-title {
  font-size: 16px; font-weight: 900; color: var(--accent);
  margin-bottom: 16px; text-align: center;
}
.result-name-row {
  text-align: center; font-size: 15px; font-weight: 700; color: var(--fg2);
  margin-bottom: 18px;
}
.pillars-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  margin-bottom: 18px;
}
.pillar-box {
  background: var(--bg2); border-radius: 12px; padding: 12px 6px;
  text-align: center;
}
.pillar-label { font-size: 11px; color: var(--fg3); margin-bottom: 6px; font-weight: 600; }
.pillar-hanja { font-size: 22px; font-weight: 900; color: var(--accent); line-height: 1.2; }
.pillar-hangul { font-size: 13px; color: var(--fg2); margin-top: 4px; }
.pillar-element { font-size: 11px; margin-top: 3px; }

.ohang-section { margin-bottom: 18px; }
.ohang-title { font-size: 13px; font-weight: 700; color: var(--fg2); margin-bottom: 10px; }
.ohang-bars { display: flex; flex-direction: column; gap: 6px; }
.ohang-row { display: flex; align-items: center; gap: 10px; }
.ohang-name { width: 28px; font-size: 13px; font-weight: 700; }
.ohang-bar-wrap { flex: 1; background: var(--border); border-radius: 99px; height: 10px; overflow: hidden; }
.ohang-bar { height: 100%; border-radius: 99px; transition: width .6s; }
.ohang-count { font-size: 12px; color: var(--fg3); width: 20px; text-align: right; }

.daewoon-section { }
.daewoon-title { font-size: 13px; font-weight: 700; color: var(--fg2); margin-bottom: 10px; }
.daewoon-list { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.daewoon-item {
  flex: 0 0 64px; background: var(--bg2); border-radius: 10px; padding: 10px 6px;
  text-align: center; border: 1.5px solid transparent;
}
.daewoon-item.current { border-color: var(--accent); background: rgba(123,47,255,.1); }
.daewoon-age { font-size: 11px; color: var(--fg3); margin-bottom: 4px; }
.daewoon-hanja { font-size: 16px; font-weight: 900; color: var(--fg); }
.daewoon-hangul { font-size: 11px; color: var(--fg2); margin-top: 2px; }

.result-note {
  margin-top: 16px; font-size: 12px; color: var(--fg3);
  text-align: center; line-height: 1.6;
  border-top: 1px solid var(--border); padding-top: 14px;
}
.btn-order {
  width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--bg2); color: var(--accent); border: 1.5px solid var(--accent);
  border-radius: 12px; padding: 13px; font-size: 15px; font-weight: 800;
  cursor: pointer; font-family: inherit; text-decoration: none;
  margin-top: 14px;
}
#toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,.85); color: #fff; padding: 10px 20px;
  border-radius: 999px; font-size: 14px; font-weight: 600;
  opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap; z-index: 999;
}
#toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <a href="./saju-page.html" class="back-btn">← 사주마루 메인으로</a>
    <div class="free-badge">🎁 무료 분석</div>
    <h1>기초 사주 무료 분석</h1>
    <p>생년월일시를 입력하면<br>사주 명식과 오행, 대운을 바로 확인할 수 있어요</p>
  </div>

  <div class="info-box">
    📌 무료로 확인할 수 있는 것<br>
    <strong>• 사주 명식 (년·월·일·시 4기둥)</strong><br>
    <strong>• 오행 구성 비율</strong><br>
    <strong>• 현재 대운 흐름</strong><br>
    <br>
    용신·격국·심층 운세 분석은 <a href="./saju-order.html" style="color:var(--accent);font-weight:700">유료 상담 신청</a>으로 받을 수 있어요

  <div class="card">

      <label>이름 <span style="font-weight:400;color:var(--fg3)">(한글 · 실명만, 닉네임 불가)</span></label>

        <select id="fHour">
          <option value="">모름 / 생략</option>
          <option value="0">子시 (23:30~01:30)</option>
          <option value="2">丑시 (01:30~03:30)</option>
          <option value="4">寅시 (03:30~05:30)</option>
          <option value="6">卯시 (05:30~07:30)</option>
          <option value="8">辰시 (07:30~09:30)</option>
          <option value="10">巳시 (09:30~11:30)</option>
          <option value="12">午시 (11:30~13:30)</option>
          <option value="14">未시 (13:30~15:30)</option>
          <option value="16">申시 (15:30~17:30)</option>
          <option value="18">酉시 (17:30~19:30)</option>
          <option value="20">戌시 (19:30~21:30)</option>
          <option value="22">亥시 (21:30~23:30)</option>
        </select>
      </div>
    </div>
  </div>

  <button class="btn-confirm" onclick="calcSaju()">
    ✨ 확인 — 기초 사주 분석 보기
  </button>

  <!-- 결과 영역 -->
  <div class="result-section" id="resultSection">

</div>

<div id="toast"></div>

<script>
// ─── 기초 데이터 ───────────────────────────────────────────
const 천간 = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const 천간음 = ['갑','을','병','정','무','기','경','신','임','계'];
const 지지 = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const 지지음 = ['자','축','인','묘','진','사','오','미','신','유','술','해'];
const 천간오행 = ['木','木','火','火','土','土','金','金','水','水'];
const 지지오행 = ['水','土','木','木','土','火','火','土','金','金','土','水'];
const 오행색 = { '木':'#16a34a', '火':'#dc2626', '土':'#ca8a04', '金':'#9ca3af', '水':'#2563eb' };
const 오행이모지 = { '木':'🌳', '火':'🔥', '土':'🌍', '金':'⚙️', '水':'💧' };

// 절기 기준 월주 계산을 위한 절기일 (양력, 간략화 — 실용 근사)
const 절기월 = [
  { m:1,  d:6  }, // 소한
  { m:2,  d:4  }, // 입춘
  { m:3,  d:6  }, // 경칩
  { m:4,  d:5  }, // 청명
  { m:5,  d:6  }, // 입하
  { m:6,  d:6  }, // 망종
  { m:7,  d:7  }, // 소서
  { m:8,  d:7  }, // 입추
  { m:9,  d:8  }, // 백로
  { m:10, d:8  }, // 한로
  { m:11, d:7  }, // 입동
  { m:12, d:7  }, // 대설
];

function 연주계산(year) {
  const idx = (year - 4) % 60;
  const t = ((idx % 10) + 10) % 10;
  const z = ((idx % 12) + 12) % 12;
  return { h: 천간[t], z: 지지[z], ho: 천간음[t], zo: 지지음[z],
           he: 천간오행[t], ze: 지지오행[z] };
}

function 월주계산(year, month, day) {
  // 절기 기준으로 달 인덱스 결정
  let jMonth = month - 1; // 0-based
  const 절기 = 절기월[month - 1];
  if (day < 절기.d) jMonth = ((month - 2) + 12) % 12;

  // 인월(寅)이 1월(index 0)
  // 연간 천간에 따라 월간 산출 (오호둔년법)
  const 연간idx = (year - 4) % 10;
  // 甲己 → 인월 丙寅, 乙庚 → 무인, 丙辛 → 경인, 丁壬 → 임인, 戊癸 → 갑인
  const 월간시작 = [2, 4, 6, 8, 0]; // 丙,戊,庚,壬,甲
  const 시작천간 = 월간시작[연간idx % 5];

  const t = (시작천간 + jMonth) % 10;
  const z = (2 + jMonth) % 12; // 寅(2)부터 시작
  return { h: 천간[t], z: 지지[z], ho: 천간음[t], zo: 지지음[z],
           he: 천간오행[t], ze: 지지오행[z] };
}

function 일주계산(year, month, day) {
  // 갑자일 기준: 2000-01-07 (양력) = 갑자
  const base = new Date(2000, 0, 7);
  const target = new Date(year, month - 1, day);
  const diff = Math.round((target - base) / 86400000);
  const idx = ((diff % 60) + 60) % 60;
  const t = idx % 10;
  const z = idx % 12;
  return { h: 천간[t], z: 지지[z], ho: 천간음[t], zo: 지지음[z],
           he: 천간오행[t], ze: 지지오행[z] };
}

function 시주계산(일주h, hourVal) {
  if (hourVal === '') return null;
  const h = parseInt(hourVal);
  // 시지: 자(0)=0, 축(2)=1, ..., 해(22)=11
  const zIdx = Math.floor(h / 2) % 12;
  // 자시 천간 = 일간에 따른 오자둔일법
  const 일간idx = 천간.indexOf(일주h);
  const 자시천간 = [0, 2, 4, 6, 8][일간idx % 5]; // 甲→甲, 乙→丙, 丙→戊, 丁→庚, 戊→壬
  const tIdx = (자시천간 + zIdx) % 10;
  return { h: 천간[tIdx], z: 지지[zIdx], ho: 천간음[tIdx], zo: 지지음[zIdx],
           he: 천간오행[tIdx], ze: 지지오행[zIdx] };
}

function 오행집계(pillars) {
  const cnt = { '木':0, '火':0, '土':0, '金':0, '水':0 };
  pillars.forEach(p => {
    if (p) { cnt[p.he]++; cnt[p.ze]++; }
  });
  return cnt;
}

function 대운계산(year, month, day, gender, 월주p) {
  // 순행/역행: 양남음녀 순행, 음남양녀 역행
  const 연간idx = (year - 4) % 10;
  const 양간 = 연간idx % 2 === 0; // 甲丙戊庚壬 = 양간
  const 순행 = (양간 && gender === '남') || (!양간 && gender === '여');

  // 대운 시작 나이: 생일~다음(이전) 절기까지 일수 / 3 (반올림)
  const birthDate = new Date(year, month - 1, day);
  let 절기날;
  if (순행) {
    // 다음 절기 찾기
    const monthIdx = month - 1;
    const 이번절기 = 절기월[monthIdx];
    if (day < 이번절기.d) {
      절기날 = new Date(year, monthIdx, 이번절기.d);
    } else {
      const nextM = (monthIdx + 1) % 12;
      const nextY = nextM === 0 ? year + 1 : year;
      절기날 = new Date(nextY, nextM, 절기월[nextM].d);
    }
  } else {
    // 이전 절기 찾기
    const monthIdx = month - 1;
    const 이번절기 = 절기월[monthIdx];
    if (day >= 이번절기.d) {
      절기날 = new Date(year, monthIdx, 이번절기.d);
    } else {
      const prevM = (monthIdx - 1 + 12) % 12;
      const prevY = monthIdx === 0 ? year - 1 : year;
      절기날 = new Date(prevY, prevM, 절기월[prevM].d);
    }
  }
  const dayDiff = Math.abs(Math.round((절기날 - birthDate) / 86400000));
  const startAge = Math.round(dayDiff / 3) || 1;

  // 월주에서 이어지는 대운 10개
  const 월zIdx = 지지.indexOf(월주p.z);
  const 월hIdx = 천간.indexOf(월주p.h);
  const result = [];
  for (let i = 1; i <= 10; i++) {
    const offset = 순행 ? i : -i;
    const zi = ((월zIdx + offset) % 12 + 12) % 12;
    const hi = ((월hIdx + offset) % 10 + 10) % 10;
    result.push({
      age: startAge + (i - 1) * 10,
      h: 천간[hi], z: 지지[zi],
      ho: 천간음[hi], zo: 지지음[zi],
    });
  }
  return { startAge, list: result };
}

// ─── 유효성 검사 & 계산 ────────────────────────────────────
function toast(msg, dur = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}

function calcSaju() {
  const name = document.getElementById('fName').value.trim();
  const gender = document.getElementById('fGender').value;
  const cal = document.getElementById('fCal').value;
  const year = parseInt(document.getElementById('fYear').value);
  const month = parseInt(document.getElementById('fMonth').value);
  const day = parseInt(document.getElementById('fDay').value);
  const hourVal = document.getElementById('fHour').value;

  if (!name) { toast('⚠️ 이름을 입력해줘요'); return; }
  if (!gender) { toast('⚠️ 성별을 선택해줘요'); return; }
  if (!year || !month || !day) { toast('⚠️ 생년월일을 입력해줘요'); return; }
  if (year < 1900 || year > 2025) { toast('⚠️ 연도는 1900~2025 사이로 입력해줘요'); return; }
  if (month < 1 || month > 12) { toast('⚠️ 월을 1~12 사이로 입력해줘요'); return; }
  if (day < 1 || day > 31) { toast('⚠️ 일을 1~31 사이로 입력해줘요'); return; }
  if (cal === '음') { toast('⚠️ 음력은 현재 양력으로 변환 후 입력해주세요'); return; }

  const 연p = 연주계산(year);
  const 월p = 월주계산(year, month, day);
  const 일p = 일주계산(year, month, day);
  const 시p = 시주계산(일p.h, hourVal);

  const pillars = [연p, 월p, 일p, 시p].filter(Boolean);
  const oh = 오행집계([연p, 월p, 일p, 시p]);
  const dw = 대운계산(year, month, day, gender, 월p);
  const currentYear = new Date().getFullYear();
  const currentAge = currentYear - year;

  // ─ 결과 렌더링 ─
  document.getElementById('resNameRow').textContent =
    `${name} (${gender === '남' ? '남성' : '여성'}) · ${year}년 ${month}월 ${day}일`;

  // 4주 그리드
  const labels = ['연주 年柱', '월주 月柱', '일주 日柱', '시주 時柱'];
  const allP = [연p, 월p, 일p, 시p];
  const grid = document.getElementById('pillarsGrid');
  grid.innerHTML = '';
  allP.forEach((p, i) => {
    if (!p) { grid.innerHTML += `<div class="pillar-box" style="opacity:.4"><div class="pillar-label">${labels[i]}</div><div class="pillar-hanja" style="font-size:14px">—</div><div class="pillar-hangul">모름</div></div>`; return; }
    grid.innerHTML += `
      <div class="pillar-box">
        <div class="pillar-label">${labels[i]}</div>
        <div class="pillar-hanja" style="color:${오행색[p.he]}">${p.h}</div>
        <div class="pillar-element" style="color:${오행색[p.he]}">${오행이모지[p.he]}${p.he}</div>
        <div class="pillar-hanja" style="color:${오행색[p.ze]};margin-top:8px">${p.z}</div>
        <div class="pillar-hangul">${p.ho}${p.zo}</div>
        <div class="pillar-element" style="color:${오행색[p.ze]}">${오행이모지[p.ze]}${p.ze}</div>
      </div>`;
  });

  // 오행 바
  const total = Object.values(oh).reduce((s,v)=>s+v,0)||1;
  const bars = document.getElementById('ohangBars');
  bars.innerHTML = '';
  ['木','火','土','金','水'].forEach(e => {
    const pct = Math.round(oh[e]/total*100);
    bars.innerHTML += `
      <div class="ohang-row">
        <span class="ohang-name">${오행이모지[e]}</span>
        <div class="ohang-bar-wrap"><div class="ohang-bar" style="width:${pct}%;background:${오행색[e]}"></div></div>
        <span class="ohang-count">${oh[e]}</span>
      </div>`;
  });

  // 대운
  const dl = document.getElementById('daewoonList');
  dl.innerHTML = '';
  dw.list.forEach(d => {
    const isCurrent = currentAge >= d.age && currentAge < d.age + 10;
    dl.innerHTML += `
      <div class="daewoon-item${isCurrent?' current':''}">
        <div class="daewoon-age">${d.age}세~</div>
        <div class="daewoon-hanja">${d.h}</div>
        <div class="daewoon-hanja">${d.z}</div>
        <div class="daewoon-hangul">${d.ho}${d.zo}</div>
      </div>`;
  });

  const sec = document.getElementById('resultSection');
  sec.classList.add('show');
  sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
</script>
</body>
</html>
