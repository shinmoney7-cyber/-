<style>
:root{--acc:#c9549a;--acc2:#f4a8cc;--acc-alt:#9c4dff;--dark:#06060f;--card-w:min(360px,92vw);--card-h:calc(var(--card-w)*16/9);color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--dark);color:#fff;font-family:"Noto Sans KR",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px 48px;gap:14px}
.page-header{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.3)}
.card{width:var(--card-w);height:var(--card-h);border-radius:20px;overflow:hidden;display:none;flex-direction:column;background:#070714;box-shadow:0 24px 64px rgba(0,0,0,.75),0 0 0 1px rgba(201,84,154,.18);transition:height .35s ease}
.card.active{display:flex}
body.social{--card-h:var(--card-w)}
body.social .card-top{flex:0 0 22%!important}
body.social .card-mid{flex:0 0 56%!important}
body.social .card-bottom{flex:0 0 22%!important}
.card-top{flex:0 0 25%;padding:18px 20px 0;display:flex;flex-direction:column;justify-content:flex-start;background:linear-gradient(180deg,rgba(6,6,15,.97) 0%,rgba(6,6,15,.65) 80%,transparent 100%);position:relative;z-index:2}
.top-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.ch-name{font-size:9px;font-weight:300;letter-spacing:2.8px;text-transform:uppercase;color:rgba(255,255,255,.45)}
.slide-badge{font-size:8px;letter-spacing:1px;padding:2px 7px;border-radius:20px;opacity:.6;border:1px solid var(--acc);color:var(--acc)}
.ch-line{width:22px;height:1.5px;margin-bottom:8px;background:linear-gradient(90deg,var(--acc),transparent)}
.card-title{font-family:"Noto Serif KR",serif;font-weight:900;font-size:clamp(18px,5.5vw,24px);line-height:1.32;color:#fff;white-space:pre-line;text-wrap:balance;text-shadow:0 0 22px rgba(201,84,154,.7),0 0 50px rgba(244,168,204,.25),0 2px 6px #000}
.card-mid{flex:0 0 50%;position:relative;overflow:hidden}
.card-mid::before,.card-mid::after{content:"";position:absolute;left:0;right:0;height:32%;pointer-events:none;z-index:1}
.card-mid::before{top:0;background:linear-gradient(to bottom,rgba(6,6,15,.72),transparent)}
.card-mid::after{bottom:0;background:linear-gradient(to top,rgba(6,6,15,.78),transparent)}
.img-layer{position:absolute;inset:0;display:none}
.img-layer.active{display:block}
.img-layer svg{width:100%;height:100%;display:block}
.card-bottom{flex:0 0 25%;padding:0 20px 16px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;background:linear-gradient(0deg,rgba(6,6,15,.98) 0%,rgba(6,6,15,.65) 60%,transparent 100%);position:relative;z-index:2}
.cta-row{display:flex;justify-content:center;margin-bottom:2px}
.cta-btn{color:#fff;font-family:"Noto Sans KR",sans-serif;font-weight:700;font-size:12px;letter-spacing:.4px;padding:10px 26px;border-radius:100px;text-decoration:none;display:inline-block;background:linear-gradient(135deg,#9c4dff,#c9549a);box-shadow:0 4px 20px rgba(201,84,154,.5)}
.card-footer{display:flex;align-items:center;gap:10px;border-top:1px solid rgba(255,255,255,.1);padding-top:10px}
.logo-circle{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Noto Serif KR",serif;font-weight:900;color:#06060f;flex-shrink:0;font-size:11px;background:linear-gradient(135deg,#c9549a,#f4a8cc)}
.f-brand{font-size:12px;font-weight:700;color:#f4a8cc}
.nav-section{display:flex;flex-direction:column;align-items:center;gap:8px;width:var(--card-w)}
.nav-dots{display:flex;gap:5px}
.dot{width:5px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);cursor:pointer;transition:all .25s}
.dot.active{background:var(--acc);width:16px}
.nav-arrows{display:flex;gap:10px;align-items:center}
.arr-btn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(201,84,154,.3);background:rgba(201,84,154,.07);color:var(--acc);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.arr-btn:hover:not(:disabled){background:rgba(201,84,154,.18)}
.arr-btn:disabled{opacity:.25;cursor:default}
.nav-label{font-size:10px;color:rgba(255,255,255,.28);letter-spacing:1.5px;min-width:36px;text-align:center}
.img-controls{display:flex;flex-direction:column;align-items:center;gap:10px;width:var(--card-w)}
.style-row{display:flex;align-items:center;gap:10px}
.sdot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.18);cursor:pointer;transition:all .2s}
.sdot.active{background:var(--acc);transform:scale(1.4)}
.ctrl-row{display:flex;gap:8px}
.ctrl-btn{padding:8px 16px;border-radius:100px;border:1px solid rgba(201,84,154,.35);background:rgba(201,84,154,.08);color:rgba(255,255,255,.7);font-size:11px;font-family:"Noto Sans KR",sans-serif;cursor:pointer;transition:all .2s;white-space:nowrap}
.ctrl-btn:hover:not(:disabled){background:rgba(201,84,154,.18);color:#fff}
.ctrl-btn.on{background:rgba(201,84,154,.28);border-color:var(--acc);color:#fff}
.ctrl-btn:disabled{opacity:.3;cursor:default}
.fmt-label{font-size:9px;color:rgba(255,255,255,.3);letter-spacing:2px;text-transform:uppercase}
</style>

<div class="nav-section" id="nav-section">
  <div class="nav-dots" id="dots"></div>
  <div class="nav-arrows">
    <button class="arr-btn" id="prev">‹</button>
    <span class="nav-label" id="nav-label">1 / 3</span>
    <button class="arr-btn" id="next">›</button>
  </div>
</div>
<div class="img-controls">
  <div class="style-row" id="style-dots">
    <span class="sdot active" data-si="0"></span>
    <span class="sdot" data-si="1"></span>
    <span class="sdot" data-si="2"></span>
  </div>
  <div class="ctrl-row">
    <button class="ctrl-btn" id="img-cycle">🎨 이미지 변경</button>
    <button class="ctrl-btn" id="fmt-toggle">📱 소셜카드</button>
  </div>
  <div class="fmt-label" id="fmt-label">케러셀 · 9:16</div>
</div>

<script>
(function(){
  let idx=0,styleIdx=0,isSocial=false;
  const cards=[...document.querySelectorAll(".card")];

  function hasLayers(){
    const card=cards[idx];
    return card?card.querySelectorAll(".img-layer").length>1:false;
  }

  function buildNav(){
    const n=cards.length;
    const dots=document.getElementById("dots");
    dots.innerHTML="";
    for(let i=0;i<n;i++){
      const d=document.createElement("div");
      d.className="dot"+(i===idx?" active":"");
      d.onclick=()=>goTo(i);
      dots.appendChild(d);
    }
    document.getElementById("nav-label").textContent=(idx+1)+" / "+n;
    document.getElementById("prev").disabled=idx===0;
    document.getElementById("next").disabled=idx===n-1;
  }

  function updateStyleDots(){
    const show=hasLayers();
    document.getElementById("style-dots").style.display=show?"flex":"none";
    document.getElementById("img-cycle").disabled=!show;
    if(!show)return;
    document.querySelectorAll(".sdot").forEach((d,i)=>d.classList.toggle("active",i===styleIdx));
  }

  function goTo(i){
    cards.forEach(c=>c.classList.remove("active"));
    idx=Math.max(0,Math.min(i,cards.length-1));
    cards[idx].classList.add("active");
    styleIdx=0;
    buildNav();
    updateStyleDots();
  }

  function cycleStyle(){
    if(!hasLayers())return;
    const layers=[...cards[idx].querySelectorAll(".img-layer")];
    layers.forEach(l=>l.classList.remove("active"));
    styleIdx=(styleIdx+1)%layers.length;
    layers[styleIdx].classList.add("active");
    updateStyleDots();
  }

  function goStyle(si){
    if(!hasLayers())return;
    const layers=[...cards[idx].querySelectorAll(".img-layer")];
    layers.forEach(l=>l.classList.remove("active"));
    styleIdx=si;
    if(layers[si])layers[si].classList.add("active");
    updateStyleDots();
  }

  document.getElementById("prev").addEventListener("click",()=>goTo(idx-1));
  document.getElementById("next").addEventListener("click",()=>goTo(idx+1));
  document.getElementById("img-cycle").addEventListener("click",cycleStyle);
  document.getElementById("fmt-toggle").addEventListener("click",()=>{
    isSocial=!isSocial;
    document.body.classList.toggle("social",isSocial);
    const btn=document.getElementById("fmt-toggle");
    btn.classList.toggle("on",isSocial);
    btn.textContent=isSocial?"📐 케러셀로":"📱 소셜카드";
    document.getElementById("fmt-label").textContent=isSocial?"소셜카드 · 1:1":"케러셀 · 9:16";
  });
  document.querySelectorAll(".sdot").forEach(d=>d.addEventListener("click",()=>goStyle(+d.dataset.si)));

  let tx=0;
  document.addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
  document.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40)goTo(idx+(dx<0?1:-1))},{passive:true});

  buildNav();
  updateStyleDots();
})();
</script>
