<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=Noto+Serif+KR:wght@400;900&display=swap">
<style>
:root {
  --gold:#c9a227;--gold2:#e8c85a;--purple:#9c6dff;--dark:#06060f;
  --card-w:min(360px,92vw);--card-h:calc(var(--card-w)*16/9);
  color-scheme:dark;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--dark);color:#fff;font-family:"Noto Sans KR",sans-serif;
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;padding:28px 16px 48px;gap:14px;
}
.page-header{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.3)}
.tabs{display:flex;background:rgba(255,255,255,.06);border-radius:100px;padding:3px}
.tab{
  padding:7px 14px;border-radius:100px;border:none;
  background:transparent;color:rgba(255,255,255,.45);
  font-size:11px;font-family:"Noto Sans KR",sans-serif;
  cursor:pointer;transition:all .2s;white-space:nowrap;
}
.tab.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#06060f;font-weight:700}
.card{
  width:var(--card-w);height:var(--card-h);border-radius:20px;overflow:hidden;
  display:none;flex-direction:column;background:#070714;
  box-shadow:0 24px 64px rgba(0,0,0,.75),0 0 0 1px rgba(156,109,255,.2);
  transition:height .35s ease;
}
.card.active{display:flex}
body.social{--card-h:var(--card-w)}
body.social .card-top{flex:0 0 22%!important}
body.social .card-mid{flex:0 0 56%!important}
body.social .card-bottom{flex:0 0 22%!important}
.card-top{
  flex:0 0 25%;padding:18px 20px 0;display:flex;flex-direction:column;
  justify-content:flex-start;
  background:linear-gradient(180deg,rgba(6,6,15,.97) 0%,rgba(6,6,15,.65) 80%,transparent 100%);
  position:relative;z-index:2;
}
.top-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.ch-name{font-size:9px;font-weight:300;letter-spacing:2.8px;text-transform:uppercase;color:rgba(255,255,255,.45)}
.ch-line{width:22px;height:1.5px;background:linear-gradient(90deg,var(--purple),transparent);margin-bottom:8px}
.card-title{
  font-family:"Noto Serif KR",serif;font-weight:900;
  font-size:clamp(19px,6vw,25px);line-height:1.32;color:#fff;white-space:pre-line;
  text-shadow:0 0 22px rgba(156,109,255,.8),0 0 55px rgba(201,162,39,.35),0 2px 6px rgba(0,0,0,1);
}
.card-mid{flex:0 0 50%;position:relative;overflow:hidden}
.card-mid::before,.card-mid::after{
  content:"";position:absolute;left:0;right:0;height:32%;pointer-events:none;z-index:1;
}
.card-mid::before{top:0;background:linear-gradient(to bottom,rgba(6,6,15,.72),transparent)}
.card-mid::after{bottom:0;background:linear-gradient(to top,rgba(6,6,15,.78),transparent)}
.img-layer{position:absolute;inset:0;display:none}
.img-layer.active{display:block}
.img-layer svg{width:100%;height:100%;display:block}
.card-bottom{
  flex:0 0 25%;padding:0 20px 16px;display:flex;flex-direction:column;
  justify-content:flex-end;gap:8px;
  background:linear-gradient(0deg,rgba(6,6,15,.98) 0%,rgba(6,6,15,.65) 60%,transparent 100%);
  position:relative;z-index:2;
}
.cta-row{display:flex;justify-content:center;margin-bottom:2px}
.cta-btn{
  background:linear-gradient(135deg,#7c4dff,#c9a227);color:#fff;
  font-family:"Noto Sans KR",sans-serif;font-weight:700;font-size:12px;
  letter-spacing:.4px;padding:10px 26px;border-radius:100px;text-decoration:none;
  display:inline-block;box-shadow:0 4px 20px rgba(124,77,255,.5);
}
.card-footer{
  display:flex;align-items:center;gap:10px;
  border-top:1px solid rgba(156,109,255,.22);padding-top:10px;
}
.logo-circle{
  width:30px;height:30px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  display:flex;align-items:center;justify-content:center;
  font-family:"Noto Serif KR",serif;font-weight:900;color:#06060f;flex-shrink:0;
}
.f-brand{font-size:12px;font-weight:700;color:var(--gold2)}
.nav-section{display:flex;flex-direction:column;align-items:center;gap:8px;width:var(--card-w)}
.nav-dots{display:flex;gap:5px}
.dot{width:5px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);cursor:pointer;transition:all .25s}
.dot.active{background:var(--purple);width:16px}
.nav-arrows{display:flex;gap:10px;align-items:center}
.arr-btn{
  width:36px;height:36px;border-radius:50%;
  border:1px solid rgba(156,109,255,.3);background:rgba(156,109,255,.07);
  color:var(--purple);font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .2s;
}
.arr-btn:hover:not(:disabled){background:rgba(156,109,255,.18)}
.arr-btn:disabled{opacity:.25;cursor:default}
.nav-label{font-size:10px;color:rgba(255,255,255,.28);letter-spacing:1.5px;min-width:36px;text-align:center}
.img-controls{display:flex;flex-direction:column;align-items:center;gap:10px;width:var(--card-w)}
.style-row{display:flex;align-items:center;gap:10px}
.sdot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.18);cursor:pointer;transition:all .2s}
.sdot.active{background:var(--purple);transform:scale(1.4)}
.ctrl-row{display:flex;gap:8px}
.ctrl-btn{
  padding:8px 16px;border-radius:100px;border:1px solid rgba(156,109,255,.35);
  background:rgba(156,109,255,.08);color:rgba(255,255,255,.7);
  font-size:11px;font-family:"Noto Sans KR",sans-serif;
  cursor:pointer;transition:all .2s;white-space:nowrap;
}
.ctrl-btn:hover{background:rgba(156,109,255,.18);color:#fff}
.ctrl-btn.on{background:rgba(156,109,255,.28);border-color:var(--purple);color:#fff}
.fmt-label{font-size:9px;color:rgba(255,255,255,.3);letter-spacing:2px;text-transform:uppercase}
</style>

    <button class="arr-btn" id="prev">&#8592;</button>

    <button class="arr-btn" id="next">&#8594;</button>
  </div>
</div>

<div class="img-controls">
  <div class="style-row">
    <span class="sdot active" data-si="0"></span>
    <span class="sdot" data-si="1"></span>
    <span class="sdot" data-si="2"></span>
  </div>
  <div class="ctrl-row">
    <button class="ctrl-btn" id="img-cycle">🎨 이미지 변경</button>
    <button class="ctrl-btn" id="fmt-toggle">📱 소셜카드</button>
  </div>
  <div class="fmt-label" id="fmt-label">케러셀 · 9:16</div>
</div>

<script>
(function(){
  const accMap={sm:"acc-sm",un:"acc-un","77":"acc-77"};
  let cur="sm",idx=0;
  const styleIdx={sm:0,un:0,"77":0};
  let isSocial=false;
  const grp=a=>document.getElementById(accMap[a]);
  const cards=a=>[...grp(a).querySelectorAll(".card")];

  function buildNav(){
    const n=cards(cur).length;
    const ns=document.getElementById("nav-section");
    ns.style.display=n<=1?"none":"";
    if(n<=1)return;
    const dots=document.getElementById("dots");
    dots.innerHTML="";
    for(let i=0;i<n;i++){
      const d=document.createElement("div");
      d.className="dot"+(i===idx?" active":"");
      d.onclick=()=>goTo(i);
      dots.appendChild(d);
    }
    document.getElementById("nav-label").textContent=(idx+1)+" / "+n;
    document.getElementById("prev").disabled=idx===0;
    document.getElementById("next").disabled=idx===n-1;
  }
  function goTo(i){
    const cs=cards(cur);
    cs.forEach(c=>c.classList.remove("active"));
    idx=Math.max(0,Math.min(i,cs.length-1));
    cs[idx].classList.add("active");
    buildNav();
  }
  function switchAcc(acc){
    grp(cur).style.display="none";
    cur=acc;idx=0;
    grp(cur).style.display="";
    cards(cur).forEach((c,i)=>c.classList.toggle("active",i===0));
    updateStyleDots();
    buildNav();
    document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.acc===acc));
  }
  function updateStyleDots(){
    document.querySelectorAll(".sdot").forEach((d,i)=>d.classList.toggle("active",i===styleIdx[cur]));
  }
  function cycleStyle(){
    const card=grp(cur).querySelector(".card.active");
    const layers=[...card.querySelectorAll(".img-layer")];
    layers.forEach(l=>l.classList.remove("active"));
    styleIdx[cur]=(styleIdx[cur]+1)%layers.length;
    layers[styleIdx[cur]].classList.add("active");
    updateStyleDots();
  }
  function goStyle(si){
    const card=grp(cur).querySelector(".card.active");
    const layers=[...card.querySelectorAll(".img-layer")];
    layers.forEach(l=>l.classList.remove("active"));
    styleIdx[cur]=si;
    layers[si].classList.add("active");
    updateStyleDots();
  }
  function toggleFormat(){
    isSocial=!isSocial;
    document.body.classList.toggle("social",isSocial);
    const btn=document.getElementById("fmt-toggle");
    btn.classList.toggle("on",isSocial);
    btn.textContent=isSocial?"📐 케러셀로":"📱 소셜카드";
    document.getElementById("fmt-label").textContent=isSocial?"소셜카드 · 1:1":"케러셀 · 9:16";
  }

  document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>switchAcc(t.dataset.acc)));
  document.getElementById("prev").addEventListener("click",()=>goTo(idx-1));
  document.getElementById("next").addEventListener("click",()=>goTo(idx+1));
  document.getElementById("img-cycle").addEventListener("click",cycleStyle);
  document.getElementById("fmt-toggle").addEventListener("click",toggleFormat);
  document.querySelectorAll(".sdot").forEach(d=>d.addEventListener("click",()=>goStyle(+d.dataset.si)));

  let tx=0;
  document.addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
  document.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40)goTo(idx+(dx<0?1:-1))},{passive:true});

  buildNav();
  updateStyleDots();
})();
</script>
