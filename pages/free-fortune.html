  margin: 12px 16px 0;
  background: var(--teal);
  border-radius: 14px;
  padding: 18px 16px;
  text-align: center;
}
.lucky-title {
  font-size: 11px;
  color: rgba(240,216,144,.6);
  letter-spacing: .18em;
  margin-bottom: 12px;

.lucky-chips {

  margin-bottom: 14px;

  font-size: 12px;

  font-size: 14px;
  color: var(--gold2);
